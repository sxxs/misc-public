<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Beach</title>
<meta name="theme-color" content="#0e4766">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one portrait beach canvas, slim tide bar on top, chunky tool bar below */
:root {
  --sea: #0e4766;
  --sea-deep: #082f47;
  --sand: #f3dca2;
  --sand-dark: #c79a58;
  --ink: #2b1a14;
  --crab: #d97757;
  --foam: #eafcff;
  --font-px: "Pixelify Sans", ui-monospace, monospace;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--sea); color: var(--foam); font-family: var(--font-body);
  box-sizing: border-box; padding-inline: 16px; padding-block: 8px;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
.app { height: 100%; max-width: 520px; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }
header { display: flex; align-items: center; gap: 12px; }
h1 { font-family: var(--font-px); font-weight: 700; font-size: clamp(15px, 4.6vw, 20px); margin: 0; color: var(--sand); letter-spacing: .02em; flex: none; }
.meters { display: flex; gap: 10px; flex: 1; min-width: 0; }
.meter { flex: 1; min-width: 0; display: grid; gap: 3px; }
.meter label { font-family: var(--font-px); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--foam); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 10px; border: 2px solid var(--ink); background: var(--sea-deep); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--sand); }
.bar.tide i { background: #45b4c6; }
.stage { position: relative; min-height: 0; display: grid; place-items: center; }
canvas { display: block; image-rendering: pixelated; touch-action: none; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--sea-deep); background: #cdeaf2; }
.toast {
  position: absolute; top: 40%; left: 50%; transform: translateX(-50%); z-index: 2;
  font-family: var(--font-px); font-size: 16px; color: var(--ink); background: var(--sand);
  border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 4px 10px; white-space: nowrap; pointer-events: none;
}
.tools { display: flex; gap: 8px; }
.mcard {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(92%, 380px);
  background: var(--sand); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 8px 12px; display: grid; gap: 4px; font-size: 14px;
}
.mcard strong { font-family: var(--font-px); font-size: 17px; }
.mcard p { margin: 0; line-height: 1.35; }
.mstatus { font-family: var(--font-px); font-size: 14px; color: #8a3b22; font-variant-numeric: tabular-nums; }
.mcard button { min-height: 44px; background: var(--crab); color: #fff8f0; font-size: 17px; }
.menu, .mresult {
  position: absolute; inset: 8px; background: var(--sand); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; z-index: 3;
}
.mresult { inset: auto 8px 64px 8px; }
.menu h2, .mresult h2 { font-family: var(--font-px); font-size: 26px; margin: 0; color: #b4532f; }
.menu h3 { font-family: var(--font-px); font-size: 16px; margin: 8px 0 0; letter-spacing: .04em; text-transform: uppercase; }
.menu p, .mresult p { margin: 0; line-height: 1.4; font-size: 15px; }
.menu .big { min-height: 56px; font-size: 20px; background: var(--crab); color: #fff8f0; }
.mlist { display: grid; gap: 8px; }
.mbtn { flex-direction: row; justify-content: flex-start; gap: 10px; text-align: left; min-height: 48px; }
.mbtn .mnum { width: 1.6em; height: 1.6em; display: grid; place-items: center; background: var(--ink); color: var(--sand); font-size: 14px; }
.mbtn .mtitle { flex: 1; min-width: 0; font-size: 16px; }
.mbtn .mok { color: #e0a01e; font-size: 20px; width: 1em; }
.rbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.rbtns button { flex: 1 1 auto; }
#rnext { background: var(--crab); color: #fff8f0; }
.camctl { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.camctl button { min-height: 40px; width: 44px; padding: 0; font-size: 22px; line-height: 1; background: rgba(243, 220, 162, 0.9); }
button {
  font: inherit; font-family: var(--font-px); font-size: 15px; color: var(--ink); background: var(--sand);
  border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 6px 8px; min-height: 48px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--foam); outline-offset: 2px; }
.tools .tool { flex: 1; }
.tools .tool[aria-pressed="true"] { background: var(--crab); color: #fff8f0; }
.tools .small { flex: none; width: 68px; font-size: 13px; }
svg.ico { width: 22px; height: 22px; shape-rendering: crispEdges; }
.sheet {
  position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--sand); color: var(--ink);
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 12px; display: grid; gap: 8px;
  font-size: 14px;
}
.sheet h2 { font-family: var(--font-px); font-size: 16px; margin: 0; }
.row { display: grid; grid-template-columns: 7.5em 1fr 3em; align-items: center; gap: 8px; }
.row output { font-variant-numeric: tabular-nums; text-align: right; }
.row input { width: 100%; accent-color: var(--crab); }
.sheet .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet .btns button { min-height: 40px; flex: 1 1 auto; font-size: 14px; }
.seed { font-size: 12px; opacity: .7; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
html, body { margin: 0; touch-action: manipulation; }
body { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.ver { font-family: var(--font-px); font-size: 11px; color: var(--foam); opacity: .6; margin-left: -6px; align-self: flex-end; }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Beach</h1><span class="ver">v1.0</span>
    <div class="meters">
      <div class="meter"><label id="tideLbl">Ebbe</label><div class="bar tide"><i id="tideBar"></i></div></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" width="180" height="290" aria-label="Strand"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="mcard" id="mcard" hidden>
      <strong id="mtitle"></strong>
      <p id="mtext"></p>
      <div class="mstatus" id="mstatus"></div>
      <button id="mgo" type="button">Los!</button>
    </div>
    <div class="menu" id="menu" hidden>
      <h2>Beach</h2>
      <p>Grab Kanäle, bau Burgen und schau, was die Flut daraus macht.</p>
      <button id="bFree" class="big" type="button">Frei spielen</button>
      <h3>Missionen</h3>
      <div class="mlist" id="mlist"></div>
    </div>
    <div class="mresult" id="mresult" hidden>
      <h2 id="rtitle"></h2>
      <p id="rtext"></p>
      <div class="rbtns">
        <button id="rnext" type="button">Weiter</button>
        <button id="rretry" type="button">Nochmal</button>
        <button id="rmenu" type="button">Menü</button>
      </div>
    </div>
    <div class="camctl" role="group" aria-label="Ansicht">
      <button id="bMenu" type="button" aria-label="Menü">☰</button>
      <button id="bRotL" type="button" aria-label="Nach links drehen">⟲</button>
      <button id="bHome" type="button" aria-label="Ansicht zurücksetzen">⌂</button>
      <button id="bRotR" type="button" aria-label="Nach rechts drehen">⟳</button>
    </div>
    <div class="sheet" id="sheet" hidden>
      <h2>Regler (Prototyp)</h2>
      <div class="row"><label for="rFlow">Fließtempo</label><input id="rFlow" type="range" min="1" max="6" step="1" value="3"><output id="oFlow">3</output></div>
      <div class="row"><label for="rEro">Erosion</label><input id="rEro" type="range" min="0" max="3" step="0.1" value="1"><output id="oEro">1</output></div>
      <div class="row"><label for="rSlump">Abrutschen</label><input id="rSlump" type="range" min="0" max="3" step="0.1" value="1"><output id="oSlump">1</output></div>
      <div class="row"><label for="rWaves">Wellen</label><input id="rWaves" type="range" min="0" max="2" step="0.1" value="1"><output id="oWaves">1</output></div>
      <div class="row"><label for="rPeriod">Tide (s)</label><input id="rPeriod" type="range" min="40" max="300" step="10" value="150"><output id="oPeriod">150</output></div>
      <div class="btns">
        <button id="bDay" type="button">Tagesstrand</button>
        <button id="bNew" type="button">Zufallsstrand</button>
        <button id="bFast" type="button">Zeit ×1</button>
        <button id="bFlood" type="button">Flut jetzt</button>
        <button id="bPause" type="button">Pause</button>
        <button id="bSound" type="button">Ton aus</button>
        <button id="bMusic" type="button">Musik: Gitarre</button>
      </div>
      <div class="seed" id="seedLbl"></div>
    </div>
  </div>

  <div class="tools" role="toolbar" aria-label="Werkzeuge">
    <button class="tool" data-tool="dig" aria-pressed="true" type="button">
      <svg class="ico" viewBox="0 0 11 11" aria-hidden="true"><rect x="5" y="0" width="1" height="6" fill="#7a4a24"/><rect x="4" y="0" width="3" height="1" fill="#7a4a24"/><rect x="3" y="6" width="5" height="3" fill="#3f6fa8"/><rect x="4" y="9" width="3" height="1" fill="#3f6fa8"/><rect x="5" y="10" width="1" height="1" fill="#3f6fa8"/></svg>
      Graben</button>
    <button class="tool" data-tool="pile" aria-pressed="false" type="button">
      <svg class="ico" viewBox="0 0 11 11" aria-hidden="true"><rect x="1" y="7" width="9" height="3" fill="#c79a58"/><rect x="2" y="5" width="7" height="2" fill="#d9b06c"/><rect x="4" y="3" width="3" height="2" fill="#e6c487"/></svg>
      Häufen</button>
    <button class="tool" data-tool="tower" aria-pressed="false" type="button">
      <svg class="ico" viewBox="0 0 11 11" aria-hidden="true"><rect x="2" y="3" width="7" height="7" fill="#d9b06c"/><rect x="2" y="1" width="1" height="2" fill="#d9b06c"/><rect x="4" y="1" width="1" height="2" fill="#d9b06c"/><rect x="6" y="1" width="1" height="2" fill="#d9b06c"/><rect x="8" y="1" width="1" height="2" fill="#d9b06c"/><rect x="5" y="6" width="1" height="4" fill="#7a4a24"/></svg>
      Turm</button>
    <button class="small" id="bSheet" type="button" aria-expanded="false" aria-controls="sheet">
      <svg class="ico" viewBox="0 0 11 11" aria-hidden="true"><rect x="1" y="2" width="9" height="1" fill="#2b1a14"/><rect x="1" y="5" width="9" height="1" fill="#2b1a14"/><rect x="1" y="8" width="9" height="1" fill="#2b1a14"/><rect x="3" y="1" width="2" height="3" fill="#d97757"/><rect x="6" y="4" width="2" height="3" fill="#d97757"/><rect x="2" y="7" width="2" height="3" fill="#d97757"/></svg>
      Regler</button>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
// ---------- world ----------
const W = 128, H = 136, N = W * H;      // sand cells (x across, y from dunes down to the sea)
const VS = 1.5;                         // vertical exaggeration in the 3D view
const IW = 180, IH = 290;               // internal render resolution (pixel look)
const LOW = -1.0, HIGH = 1.9;
const SEA_ROWS = 2;

const b = new Float32Array(N), rk = new Float32Array(N), d = new Float32Array(N);
const fL = new Float32Array(N), fR = new Float32Array(N), fT = new Float32Array(N), fB = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N);
const pk = new Float32Array(N); // packed sand (tower walls), 0..1
const s = new Float32Array(N), s2 = new Float32Array(N), m = new Float32Array(N), dl = new Float32Array(N);
const tmp = new Float32Array(N);
let seabed = [], seaMask = new Uint8Array(N);

const P = { flow: 3, ero: 1, slump: 1, waves: 1, period: 150 };
let phase = 0.06, speed = 1, paused = false;
let tool = 'dig', seed = 0, towers = [];
let waves = [], nextWave = 3, waveNow = 0, clock = 0, seaNow = 0;

// ---------- rng + noise ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(rng) {
  const p = new Uint8Array(512), g = new Float32Array(256);
  for (let i = 0; i < 256; i++) { p[i] = i; g[i] = rng(); }
  for (let i = 255; i > 0; i--) { const j = (rng() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const v = (x, y) => g[p[p[x & 255] + (y & 255)]];
  const sm = t => t * t * (3 - 2 * t);
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = v(xi, yi), c = v(xi + 1, yi), e = v(xi, yi + 1), f = v(xi + 1, yi + 1);
    return (a + (c - a) * xf) + ((e + (f - e) * xf) - (a + (c - a) * xf)) * yf;
  };
  return (x, y, oct = 4) => { let s = 0, amp = 0.5, fr = 1, norm = 0; for (let o = 0; o < oct; o++) { s += amp * n(x * fr, y * fr); norm += amp; amp *= 0.5; fr *= 2; } return s / norm; };
}

// ---------- beach generation ----------
function levelAt(p) { return LOW + (HIGH - LOW) * (1 - Math.cos(2 * Math.PI * p)) / 2; }
function generate(newSeed) {
  seed = newSeed;
  const rng = mulberry(seed), fbm = makeNoise(rng);
  const creekOff = rng() * 100, creekDepth = 0.6 + rng() * 0.6, creekTop = 0.3 + rng() * 0.2;
  rk.fill(-99); pk.fill(0); d.fill(0); s.fill(0); fL.fill(0); fR.fill(0); fT.fill(0); fB.fill(0); vx.fill(0); vy.fill(0);
  for (let y = 0; y < H; y++) {
    const yy = y / (H - 1), creekX = W * (0.2 + 0.6 * fbm(creekOff, y * 0.014, 3));
    for (let x = 0; x < W; x++) {
      let h = 5.5 - 8 * yy;
      h += 2.2 * (fbm(x * 0.05, y * 0.05) - 0.5) * (1 - yy) * (1 - yy);
      h += 0.5 * (fbm(x * 0.13 + 50, y * 0.13, 3) - 0.5);
      h += 0.06 * Math.sin(y * 0.9 + 2 * fbm(x * 0.1, y * 0.05, 2));
      if (yy > creekTop) { const w = Math.abs(x - creekX) / 3.5; if (w < 1) h -= creekDepth * (1 - w * w) * Math.min(1, (yy - creekTop) * 6); }
      b[y * W + x] = h;
    }
  }
  const nRocks = 4 + ((rng() * 5) | 0);
  for (let r = 0; r < nRocks; r++) {
    const cx = 7 + rng() * (W - 14), cy = H * (0.3 + rng() * 0.5), rad = 2.2 + rng() * 3, lift = 0.8 + rng() * 1.2;
    for (let y = Math.floor(cy - rad - 3); y <= cy + rad + 3; y++) for (let x = Math.floor(cx - rad - 3); x <= cx + rad + 3; x++) {
      if (x < 0 || y < 0 || x >= W || y >= H - SEA_ROWS) continue;
      const dist = Math.hypot(x - cx, (y - cy) * 1.2) / (rad * (0.75 + 0.5 * fbm(x * 0.3, y * 0.3, 2)));
      if (dist < 1) { const i = y * W + x; b[i] += lift * Math.sqrt(1 - dist * dist) + 0.2; rk[i] = b[i]; }
    }
  }
  // open sea floor: everything below low water that is connected to the front edge
  const mask = new Uint8Array(N), queue = [];
  for (let x = 0; x < W; x++) { const i = (H - 1) * W + x; mask[i] = 1; queue.push(i); }
  while (queue.length) {
    const i = queue.pop(), x = i % W;
    for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W]) if (j >= 0 && j < N && !mask[j] && b[j] < LOW + 0.2) { mask[j] = 1; queue.push(j); }
  }
  seabed = []; for (let i = 0; i < N; i++) if (mask[i]) seabed.push(i);
  seaMask = mask;
  const lvl = levelAt(phase);
  for (let i = 0; i < N; i++) { d[i] = Math.max(0, lvl - b[i]); m[i] = b[i] < HIGH + 0.3 ? 0.75 : 0; }
  resetDecor();
}

// ---------- water: virtual pipes ----------
function flowStep(dt, sea) {
  const g = 9.81, damp = 0.996;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, h = b[i] + d[i];
    let l = 0, r = 0, t = 0, o = 0;
    if (x > 0) l = Math.max(0, fL[i] * damp + dt * g * (h - b[i - 1] - d[i - 1]));
    if (x < W - 1) r = Math.max(0, fR[i] * damp + dt * g * (h - b[i + 1] - d[i + 1]));
    if (y > 0) t = Math.max(0, fT[i] * damp + dt * g * (h - b[i - W] - d[i - W]));
    if (y < H - 1) o = Math.max(0, fB[i] * damp + dt * g * (h - b[i + W] - d[i + W]));
    const sum = l + r + t + o;
    if (sum > 0) { const k = Math.min(1, d[i] / (sum * dt)); l *= k; r *= k; t *= k; o *= k; }
    fL[i] = l; fR[i] = r; fT[i] = t; fB[i] = o;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const inL = x > 0 ? fR[i - 1] : 0, inR = x < W - 1 ? fL[i + 1] : 0;
    const inT = y > 0 ? fB[i - W] : 0, inB = y < H - 1 ? fT[i + W] : 0;
    const d0 = d[i];
    let dn = d0 + dt * (inL + inR + inT + inB - fL[i] - fR[i] - fT[i] - fB[i]);
    dn = Math.max(0, dn - 0.004 * dt);
    d[i] = dn;
    const da = (d0 + dn) / 2;
    if (da > 0.01) {
      const u = (inL - fL[i] + fR[i] - inR) / 2 / da, w = (inT - fT[i] + fB[i] - inB) / 2 / da;
      vx[i] = u > 3 ? 3 : u < -3 ? -3 : u; vy[i] = w > 3 ? 3 : w < -3 ? -3 : w;
    } else { vx[i] = 0; vy[i] = 0; }
  }
  for (let y = H - SEA_ROWS; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; d[i] = Math.max(0, sea - b[i]); s[i] = 0; }
  // permanent sea floor follows the sea level, so the open sea keeps up with the tide
  for (const i of seabed) { const t = sea - b[i]; if (t > 0) d[i] += (t - d[i]) * 0.05; }
}

// ---------- hydraulic erosion ----------
function erodeStep(dt) {
  const Kc = 0.5, Ks = 0.012 * P.ero, Kd = 0.03;
  if (Ks <= 0) return;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (d[i] < 0.004) { if (s[i] > 0) { b[i] += s[i]; s[i] = 0; } continue; }
    const gx = (b[i + 1] - b[i - 1]) / 2, gy = (b[i + W] - b[i - W]) / 2, g2 = gx * gx + gy * gy;
    const sinT = Math.max(0.08, Math.sqrt(g2 / (1 + g2)));
    const sp = Math.hypot(vx[i], vy[i]);
    const C = Math.min(0.35, Kc * sinT * sp * Math.min(1, d[i] * 4));
    if (C > s[i]) { let a = Ks * (C - s[i]); a = Math.min(a, b[i] - rk[i]); if (a > 0) { b[i] -= a; s[i] += a; } }
    else { const a = Kd * (s[i] - C); b[i] += a; s[i] -= a; }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let px = x - vx[i] * dt, py = y - vy[i] * dt;
    px = px < 0 ? 0 : px > W - 1.001 ? W - 1.001 : px; py = py < 0 ? 0 : py > H - 1.001 ? H - 1.001 : py;

function newBeach(daily) {

function tideLabel(p) {

}
function hud() {
  const lvl = levelAt(phase), toHigh = Math.ceil(((0.5 - phase + 1) % 1) * P.period / speed);
  $('tideLbl').textContent = tideLabel(phase) + (phase < 0.43 || phase > 0.57 ? ' · Hochwasser in ' + Math.floor(toHigh / 60) + ':' + String(toHigh % 60).padStart(2, '0') : '');

// ---------- shells can be picked up by tapping ----------
let shellCount = 0;
function tryCollectShell(x, z) {
  let best = -1, bd = 1.8;
  shells.forEach((sh, k) => { const dd = Math.hypot(sh.x - x, sh.y - z); if (dd < bd) { bd = dd; best = k; } });
  if (best < 0) return false;
  const sh = shells[best];
  scene.remove(sh.s); shells.splice(best, 1); shellCount++;
  for (let k = 0; k < 10; k++) { const a = Math.random() * 6.283; parts.push({ x: sh.x, y: sh.y, z: surf(sh.x, sh.y) + 0.3, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, vz: 5 + Math.random() * 3, t: 0, foam: true }); }
  plingSound();
  if (!mission) toast(shellCount === 1 ? 'Eine Muschel gefunden!' : shellCount + ' Muscheln gefunden!');
  return true;
}
function plingSound() {
  if (!ac) return;
  const t = ac.currentTime;
  [1320, 1760].forEach((f, k) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + k * 0.07); g.gain.exponentialRampToValueAtTime(0.09, t + k * 0.07 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.07 + 0.35);
    o.connect(g).connect(sfxBus); o.start(t + k * 0.07); o.stop(t + k * 0.07 + 0.4);
  });
}
function addShell(x, z) {
  const [tex, w, h] = SHELLS[(Math.random() * SHELLS.length) | 0];
  const s = pixSprite(tex, w, h, 0.38); s.visible = true;
  shells.push({ x, y: z, s });
}

{

const towelTex = pixTexture(['rrwwbbwwrr', 'rrwwbbwwrr', 'rrwwbbwwrr', 'rrwwbbwwrr', 'rrwwbbwwrr', 'rrwwbbwwrr', 'rrwwbbwwrr', 'rrwwbbwwrr'], { r: '#e2483d', w: '#fbf6ea', b: '#3f78c8' });

// ---------- missions ----------
const $m = id => document.getElementById(id);
let mission = null, mDone = [];
try { mDone = JSON.parse(localStorage.getItem('beach:done') || '[]'); } catch (e) { mDone = []; }
function saveDone() { try { localStorage.setItem('beach:done', JSON.stringify(mDone)); } catch (e) {} }
// find a spot in the middle stripe of the beach where the sand has height `hb`
function spotAtHeight(hb, rng, check) {
  for (let k = 0; k < 80; k++) {
    const x = Math.round(W / 2 + (rng() - 0.5) * 30);
    for (let z = 8; z < H - 8; z++) {
      const i = z * W + x;
      if (b[i] <= hb) {
        let ok = true;
        for (let dz = -7; dz <= 7 && ok; dz++) for (let dx = -7; dx <= 7; dx++) if (rk[(z + dz) * W + x + dx] > -50) { ok = false; break; }
        if (ok && check) ok = check(x, z);
        if (ok) return [x, z];
        break;
      }
    }
  }
  return [W >> 1, H >> 1];
}
function lookAt(x, z) { Object.assign(cam, { tx: x, tz: Math.min(H - 30, z + 8), zoom: 1.15 }); cam.goalYaw = cam.yaw = 0; }
function seaReachable(start) {
  const seen = new Uint8Array(N), st = [start]; seen[start] = 1;
  let n = 0;
  while (st.length && n < 30000) {
    const i = st.pop(); n++;
    if (seaMask[i] || i >= (H - 3) * W) return true;
    const x = i % W;
    for (const j of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W]) if (j >= 0 && j < N && !seen[j] && d[j] > 0.02) { seen[j] = 1; st.push(j); }
  }
  return false;
}
const MISSIONS = [
  {
    id: 'shells', title: 'Muschelsuche', text: 'Sammle 8 Muscheln, bevor die Möwe oder die Flut sie holen. Tippe sie einfach an.',
    phase: 0.28,
    setup(rng) {
      const [cx, cz] = spotAtHeight(0.4, rng);
      for (let k = 0; k < 12; k++) {
        for (let t = 0; t < 40; t++) {
          const x = cx + (rng() - 0.5) * 50, z = cz + (rng() - 0.5) * 40, i = cellOf(x, z);
          if (i >= 0 && d[i] < 0.01 && b[i] > levelAt(this.phase) + 0.2 && b[i] < HIGH) { addShell(x, z); break; }
        }
      }
      shellCount = 0; nextGull = clock + 5; this.gullEvery = 6;
      lookAt(cx, cz - 4);
    },
    update() {
      if (!gull && nextGull > clock + this.gullEvery) nextGull = clock + this.gullEvery;
      if (shellCount >= 8) return 'win';
      if (shellCount + shells.length < 8) return 'fail';
    },
    status() { return 'Muscheln: ' + shellCount + ' von 8'; },
    fail: 'Die Möwe war schneller. Nochmal?',
  },
  {
    id: 'fish', title: 'Rette den Fisch', text: 'Der kleine Fisch steckt im Tümpel fest, und das Wasser versickert. Grab ihm einen Kanal bis zum Meer!',
    phase: 0.9,
    setup(rng) {
      const [px, pz] = spotAtHeight(1.3, rng), R = 4;
      const rim = b[pz * W + px] + 0.25;
      this.pool = [];
      for (let z = pz - 7; z <= pz + 7; z++) for (let x = px - 7; x <= px + 7; x++) {
        const i = z * W + x, r = Math.hypot(x - px, z - pz);
        if (r < R) { b[i] = Math.min(b[i], rim - 1.1 * (1 - (r / R) ** 2) - 0.15); this.pool.push(i); }
        else if (r < R + 2.5) b[i] = Math.max(b[i], rim + 0.15 * (1 - (r - R) / 2.5));
      }
      for (const i of this.pool) { d[i] = Math.max(0, rim - 0.1 - b[i]); m[i] = 1; }
      this.full = this.pool.reduce((s, i) => s + d[i], 0);
      this.px = px; this.pz = pz; this.left = 1;
      lookAt(px, pz);
    },
    update(dt) {
      for (const i of this.pool) if (d[i] > 0) d[i] = Math.max(0, d[i] - 0.03 * dt);

      poolFish.material.map = fishTex[Math.sin(a) > 0 ? 0 : 1];
      poolFish.material.rotation = wob ? Math.sin(clock * 14) * 0.5 : 0;
      poolFish.position.set(fx, (b[c] + d[c]) * VS + 0.25, fz);
      if (((clock * 2) | 0) !== this.tick) { this.tick = (clock * 2) | 0; if (d[c] > 0.03 && seaReachable(c)) return 'win'; }
      if (this.left < 0.06) return 'fail';
    },
    status() { return 'Wasser im Tümpel: ' + Math.round(this.left * 100) + ' %'; },
    win() { poolFish.visible = false; splash(this.px, this.pz, b[this.pz * W + this.px] + 0.5, true); },
    fail: 'Der Fisch braucht schneller einen Weg zum Meer. Nochmal?',
  },
  {
    id: 'moat', title: 'Wasser für den Burggraben', text: 'Die Burg oben am Strand wünscht sich Wasser im Graben. Leite das Meer bis zur gelben Fahne!',
    phase: 0.06,
    setup(rng) {

      tower(mx, mz - 9);
      marker = { x: mx, z: mz, r: 1.8, pennant: true };
      this.cells = []; for (let z = mz - 1; z <= mz + 1; z++) for (let x = mx - 1; x <= mx + 1; x++) this.cells.push(z * W + x);

    update() {

    status() { return phase < 0.5 ? 'Hochwasser kommt in ' + Math.ceil((0.5 - phase) * P.period / speed) + ' s' : 'Das Wasser geht zurück …'; },
    fail: 'Das Wasser kam nicht bis zur Fahne. Grab den Kanal bis ganz hin!',

  {
    id: 'towel', title: 'Handtuch trocken halten', text: 'Das Handtuch liegt zu nah am Wasser. Bau einen Damm, damit es bei Hochwasser trocken bleibt!',

    status() { return phase < 0.5 ? 'Hochwasser kommt in ' + Math.ceil((0.5 - phase) * P.period / speed) + ' s' : 'Hält der Damm?'; },
    fail: 'Platsch, das Handtuch ist nass. Ein höherer Damm hilft!',
  },
  {

    setup(rng) {

    },
    update() { return this.result; },
    status() {
      const n = towers.filter(t => Math.hypot(t.x - this.cx, t.y - this.cz) < 7.5).length;
      return (n ? n + (n === 1 ? ' Turm' : ' Türme') + ' im Kreis · ' : 'Noch kein Turm im Kreis · ') + (phase < 0.5 ? 'Hochwasser in ' + Math.ceil((0.5 - phase) * P.period / speed) + ' s' : '');
    },

function clearMissionProps() {
  marker = null; towel.visible = false; poolFish.visible = false;
}
function showMenu() {
  mission = null; clearMissionProps();
  $m('mcard').hidden = true; $m('mresult').hidden = true;
  const list = $m('mlist'); list.innerHTML = '';
  MISSIONS.forEach((ms, k) => {
    const btn = document.createElement('button');

}

  $m('mcard').hidden = true; $m('mresult').hidden = true;
  P.period = parseFloat($m('rPeriod').value);
  newBeach(true);
  Object.assign(cam, { zoom: CAM0.zoom, tx: CAM0.tx, tz: CAM0.tz }); cam.goalYaw = cam.yaw;
  paused = false;
}
$m('mgo').addEventListener('click', () => { audioInit(); mission.state = 'run'; $m('mgo').hidden = true; $m('mtext').hidden = true; paused = false; });
$m('bFree').addEventListener('click', () => { audioInit(); freePlay(); });
$m('bMenu').addEventListener('click', showMenu);
$m('rretry').addEventListener('click', () => startMission(mission.k));

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  moved = 0;
  if (!paused) {
    clock += dt;
    const prev = phase;
    phase = (phase + dt * speed / P.period) % 1;
    if (prev < 0.5 && phase >= 0.5) highWater();
    if (clock > nextWave) { waves.push({ t: 0, amp: (0.2 + Math.random() * 0.35) * P.waves, dur: 1.4 + Math.random() }); nextWave = clock + 3 + Math.random() * 4; }
    waveNow = 0;
    waves = waves.filter(w => { w.t += dt; if (w.t > w.dur) return false; waveNow += w.amp * Math.sin(Math.PI * w.t / w.dur); return true; });
    const sea = levelAt(phase) + waveNow + 0.05 * Math.sin(clock * 1.3) * P.waves;
    if (pointer) {
      pointer.still += dt;
      if (pointer.still > 0.15) { if (tool === 'dig') digHold(pointer.wx, pointer.wy, dt); else if (tool === 'pile') pileHold(pointer.wx, pointer.wy, dt); }
    }
    for (let k = 0; k < P.flow; k++) { flowStep(0.08, sea); erodeStep(0.08); }
    slump(); moisture(); crabUpdate(dt);
    seaNow = sea;
    if (phase > 0.3 && phase < 0.7) for (let i = 0; i < N; i++) if (d[i] > 0.02) wetCyc[i] = 1;
    if (prev < 0.72 && phase >= 0.72) tangFromCycle();
    tension += (Math.max(0, Math.min(1, (levelAt(phase) - LOW) / (HIGH - LOW))) - tension) * Math.min(1, dt * 0.5);
    fishUpdate(dt); shellsUpdate(dt); gullUpdate(dt); missionUpdate(dt);
  }
  partsUpdate(dt);
  sandSound(dt);
  cam.yaw += (cam.goalYaw - cam.yaw) * Math.min(1, dt * 8); updateCamera();
  updateMeshes(); partsDraw(); ringDraw(); towersDraw(); markerDraw();
  renderer.render(scene, camera);
  hud();
  requestAnimationFrame(loop);
}

newBeach(true);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
