<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was gibt's?</title>
<meta name="theme-color" content="#0F3239">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Was gibt's?">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --glaze:#0F3239;        /* dunkle Glasur, Hintergrund */
  --tile:#164751;         /* Kachelfläche */
  --tile-hi:#1D5C68;      /* Kachel hell */
  --grout:#E9E2D3;        /* Fuge */
  --chalk:#F3EEE2;        /* Text hell */
  --mustard:#E3A72F;      /* Akzent: gern */
  --tomato:#C9452F;       /* Akzent: nie */
  --sage:#8FAE93;         /* Akzent: unbekannt */
  --dim:rgba(243,238,226,.55);
  --r:3px;
  --disp:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Archivo","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--glaze);
  color:var(--chalk);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
/* Fugenraster im Hintergrund */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);
  background-size:56px 56px;opacity:.045;
}
.wrap{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:0 20px}
header{padding:40px 0 28px;border-bottom:1px solid rgba(233,226,211,.16);margin-bottom:28px}
h1{font-family:var(--disp);font-size:clamp(34px,7vw,58px);line-height:.95;margin:0 0 10px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--mustard)}
.sub{color:var(--dim);max-width:52ch;font-size:15px;margin:0}
h2{font-family:var(--disp);font-size:19px;letter-spacing:.01em;margin:34px 0 12px}
h3{font-family:var(--disp);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mustard);margin:26px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--dim);font-size:14px}

nav.tabs{display:flex;gap:2px;margin-bottom:26px;flex-wrap:wrap}
nav.tabs button{
  font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--tile);color:var(--dim);border:0;border-radius:var(--r);
  padding:11px 15px;cursor:pointer;transition:background .15s,color .15s;
}
nav.tabs button[aria-selected="true"]{background:var(--mustard);color:#12262B}

/* Personen-Kacheln */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px}
.person{
  background:var(--tile);border:0;border-radius:var(--r);color:var(--chalk);
  padding:20px 16px 16px;text-align:left;cursor:pointer;font-family:var(--body);
  transition:background .15s, transform .15s;
}
.person .nm{font-family:var(--disp);font-size:22px;display:block;margin-bottom:8px}
.bar{height:5px;background:rgba(243,238,226,.14);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--mustard);transition:width .3s}
.person .st{font-size:12px;color:var(--dim);letter-spacing:.03em}

/* Sichtungskarte */
.card{
  background:var(--tile);border-radius:var(--r);padding:34px 26px;text-align:center;
  min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.card .dish{font-family:var(--disp);font-size:clamp(24px,5.2vw,36px);line-height:1.1;margin:0 0 14px;max-width:16ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);border:1px solid rgba(243,238,226,.2);padding:3px 8px;border-radius:99px}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:2px}
.answers button{
  border:0;border-radius:var(--r);padding:18px 6px;cursor:pointer;font-family:var(--body);
  font-weight:700;font-size:13px;letter-spacing:.03em;background:var(--tile);color:var(--chalk);
  transition:background .12s,color .12s;line-height:1.3;
}
.answers button span{display:block;font-size:22px;margin-bottom:4px;font-weight:400}
.progress{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;font-size:13px;color:var(--dim)}

/* Duell */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.duel button{
  background:var(--tile);border:0;border-radius:var(--r);color:var(--chalk);cursor:pointer;
  padding:38px 18px;font-family:var(--disp);font-size:clamp(17px,3.4vw,23px);line-height:1.15;
  transition:background .12s,color .12s;
}
.vs{text-align:center;font-family:var(--disp);color:var(--dim);font-size:12px;letter-spacing:.3em;margin:10px 0}

/* Ergebnisliste */
ol.rank{list-style:none;margin:0;padding:0;counter-reset:r}
ol.rank li{
  counter-increment:r;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;
  background:var(--tile);border-radius:var(--r);padding:12px 14px;margin-bottom:2px;
}
ol.rank li::before{content:counter(r);font-family:var(--disp);color:var(--mustard);font-size:15px}
ol.rank .nm{font-weight:600;font-size:15px}
ol.rank .meta{font-size:12px;color:var(--dim);margin-top:2px}
.faces{display:flex;gap:3px}
.face{width:22px;height:22px;border-radius:2px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#12262B;background:rgba(243,238,226,.16)}
.f-gern{background:var(--mustard)}
.f-ok{background:rgba(243,238,226,.42)}
.f-neu{background:var(--sage)}
.f-nie{background:var(--tomato);color:var(--chalk)}

.veto{display:flex;flex-wrap:wrap;gap:2px}
.veto span{background:rgba(201,69,47,.16);color:rgba(243,238,226,.7);border-radius:var(--r);padding:6px 10px;font-size:13px}

/* Wochenplan: eine Zeile je Tag - Tagesname, Mittagessen, Abendessen.
   Dadurch stehen die Abendessen aller Tage sauber in einer Spalte untereinander. */
.plan{display:flex;flex-direction:column;gap:2px}
.pday{display:grid;grid-template-columns:116px minmax(0,.88fr) minmax(0,1.32fr);gap:2px;align-items:stretch}
.pdname{background:var(--tile);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;font-family:var(--disp);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mustard)}
.pdname>span{min-width:0;overflow-wrap:anywhere;line-height:1.15}
.slot{background:var(--tile);border-radius:var(--r);padding:14px 14px 12px;min-height:112px;display:flex;flex-direction:column;position:relative}
.slot .day{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;padding-right:38px}
.slot .dish{font-family:var(--disp);font-size:16px;line-height:1.15;margin-bottom:auto}
.slot .tag{font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:.03em}
.slot.exp{background:var(--tile-hi);outline:1px solid var(--sage)}
/* Mittagessen bleibt kleiner und gedimmt - der Abend ist die Hauptmahlzeit */
.slot.mit{min-height:0;padding:10px 12px;background:rgba(22,71,81,.55)}
.slot.mit .day{font-size:10px;margin-bottom:3px;padding-right:32px}
.slot.mit .dish{font-family:var(--body);font-weight:600;font-size:13.5px;color:rgba(243,238,226,.72)}
.slot.mit .tag{font-size:10.5px;margin-top:6px}
.slot.mit .ex{font-size:11.5px;padding:5px 7px}
.slot.mit .slotrow{gap:3px;margin-top:8px}
.slot.mit .swap{font-size:13px;padding:0;min-width:42px;height:34px}
.lunchoff{background:transparent;border:1px dashed rgba(243,238,226,.13);border-radius:var(--r);color:rgba(243,238,226,.3);font-family:var(--body);font-size:12px;padding:8px;cursor:pointer;min-height:44px}
@media(max-width:640px){
  .pday{grid-template-columns:1fr}
  .pdname{flex-direction:row;align-items:center;justify-content:space-between;padding:8px 8px 8px 12px;font-size:11px}
  .slot{min-height:0}
}

.btn{
  font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--mustard);color:#12262B;border:0;border-radius:var(--r);padding:13px 20px;cursor:pointer;
}
.btn.ghost{background:var(--tile);color:var(--chalk)}
.row{display:flex;gap:2px;flex-wrap:wrap;margin:16px 0}
.notice{background:var(--mustard);color:#12262B;border-radius:var(--r);padding:11px 14px;font-weight:600;font-size:14px;margin-bottom:16px}
.codetext{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all;color:var(--dim);margin:14px 0 0;line-height:1.6}
textarea.code{width:100%;background:var(--tile);color:var(--chalk);border:0;border-radius:var(--r);padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;resize:vertical}
textarea.code::placeholder{color:var(--dim)}
.empty{background:var(--tile);border-radius:var(--r);padding:26px;color:var(--dim);font-size:15px}
/* Wochenplan: Tauschen, Pinnen, Brotzeit-Toggle, Einkaufsliste */
.slot .slotrow{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.slot .swap{align-self:flex-start;background:rgba(243,238,226,.08);border:0;border-radius:var(--r);color:var(--dim);font-family:var(--body);font-size:12px;padding:6px 10px;cursor:pointer;transition:background .15s,color .15s}
.slot.pinned{outline:1px solid var(--mustard)}
.slot.pinned .pin{background:var(--mustard);color:#12262B}
.slot .ex{margin-top:8px;font-size:12.5px;line-height:1.45;color:var(--mustard);background:rgba(227,167,47,.12);border-radius:var(--r);padding:7px 9px}
.slot .ex b{font-weight:600}
/* Ziehgriff und Drag & Drop (Karte auf Karte, Tagesleiste auf Tagesleiste) */
.grip{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:var(--r);background:rgba(243,238,226,.07);color:var(--dim);font-size:14px;line-height:1;cursor:grab;touch-action:none;display:grid;place-items:center;padding:0}
.slot.mit .grip{width:30px;height:30px;top:4px;right:4px;font-size:12px}
.pdname .grip{position:static;width:30px;height:30px;flex:0 0 30px}
.dragsrc{opacity:.28}
.dropok{outline:2px dashed var(--mustard);outline-offset:-3px}
.dropno{outline:2px dashed var(--tomato);outline-offset:-3px}
.dragghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;opacity:.95;box-shadow:0 18px 36px rgba(0,0,0,.5)}
body.dragging-on{user-select:none;-webkit-user-select:none}
/* Zufriedenheit: pro Person ein Balken, live zum aktuellen Entwurf */
.happy{background:var(--tile);border-radius:var(--r);padding:14px 16px 12px;margin-bottom:2px}
.hhead{font-family:var(--disp);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--mustard);margin-bottom:10px}
.hhead b{color:var(--chalk)}
.hhead span{text-transform:none;letter-spacing:0;font-family:var(--body)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-bottom:7px;font-size:13px}
.hrow .hnm{flex:0 0 70px;font-weight:600}
.hrow .bar{display:block;flex:1 1 90px;min-width:70px;margin:0}
.hrow .hpct{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums}
.hrow .hmeta{flex:1 1 100%;font-size:12px;color:var(--dim);padding-left:80px}
.hrow.low .hpct{color:var(--tomato)}
.hnote{font-size:12.5px;color:var(--dim);margin:8px 0 0;line-height:1.45}
@media(max-width:520px){.hrow .hmeta{padding-left:0}}
/* Ersetzen: Suchblatt mit Volltextsuche */
.modal{position:fixed;inset:0;z-index:80;background:rgba(6,20,23,.74);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--glaze);border-top:1px solid rgba(233,226,211,.18);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:660px;max-height:90vh;display:flex;flex-direction:column;padding:14px 16px 18px}
@media(min-width:660px){.modal{align-items:center;padding:24px}.sheet{border:1px solid rgba(233,226,211,.18);border-radius:var(--r)}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--disp);font-size:14px;letter-spacing:.04em}
.sheethead .x{background:rgba(243,238,226,.08);border:0;border-radius:var(--r);color:var(--chalk);width:38px;height:38px;font-size:15px;cursor:pointer}
.sheet .searchbox{margin:12px 0 6px}
.sheet .hint{font-size:12px;color:var(--dim);margin:0 0 4px}
.sheet .legend{margin-bottom:10px}
.results{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.res{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;width:100%;text-align:left;background:var(--tile);border:0;border-radius:var(--r);color:var(--chalk);font-family:var(--body);padding:11px 13px;margin-bottom:2px;cursor:pointer}
.res .resn{flex:1 1 150px;font-weight:600;font-size:14.5px}
.res .resd{flex:0 0 auto;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.res .resd.up{color:var(--mustard)}
.res .resd.down{color:var(--tomato)}
.res .resf{flex:0 0 auto;display:flex;gap:3px}
.res .resm{flex:1 1 100%;font-size:11.5px;color:var(--dim)}
.shop{margin:0 0 12px;padding-left:22px;columns:2;column-gap:24px}
.shop li{margin-bottom:6px;font-size:14px;break-inside:avoid}
@media(max-width:520px){.shop{columns:1}}
.toggle{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--mustard);flex-shrink:0}
.toggle b{color:var(--mustard);font-weight:600}
.daychips{display:inline-flex;gap:4px;flex-wrap:wrap}
.daychip{min-width:44px;height:36px;border:0;border-radius:var(--r);background:rgba(243,238,226,.08);color:var(--dim);font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;padding:0 10px}
.daychip.on{background:var(--mustard);color:#12262B}
/* Einklappbare Abschnitte */
details.fold{background:var(--tile);border-radius:var(--r);margin:10px 0;overflow:hidden}
details.fold summary{cursor:pointer;list-style:none;font-family:var(--disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mustard);padding:13px 16px;user-select:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";color:var(--dim)}
details.fold[open] summary::before{content:"▾ ";color:var(--dim)}
details.fold .foldbody{padding:2px 16px 16px}
details.fold .foldbody h3{margin-top:14px}
/* Was ist das? */
.what{font-size:14px;color:var(--dim);margin:6px 0 0;line-height:1.4}
.what b{color:var(--sage);font-weight:600}
/* Übertragen: Ablauf-Schritte */
.steps{margin:0 0 10px;padding-left:22px}
.steps li{margin-bottom:10px;font-size:14px;line-height:1.5;color:var(--chalk)}
.steps b{color:var(--mustard);font-weight:600}
/* Revidier-Liste */
.searchbox{width:100%;background:var(--tile);border:0;border-radius:var(--r);color:var(--chalk);padding:12px 14px;font-family:var(--body);font-size:16px;margin:14px 0 4px}
.searchbox::placeholder{color:var(--dim)}
.rev{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;background:var(--tile);border-radius:var(--r);padding:8px 12px;margin-bottom:2px}
.rev .nm{flex:1 1 160px;font-size:14px}
.rev .mini{display:flex;gap:4px}
.rev .mini button{width:44px;height:44px;border:0;border-radius:var(--r);background:rgba(243,238,226,.08);color:var(--dim);cursor:pointer;font-size:16px;font-family:var(--body)}
.rev .mini button.on-gern{background:var(--mustard);color:#12262B}
.rev .mini button.on-ok{background:var(--tile-hi);color:var(--chalk)}
.rev .mini button.on-nie{background:var(--tomato);color:#fff}
.rev .mini button.on-neu{background:var(--sage);color:#12262B}
/* Hover nur bei echter Maus - auf Touch-Geräten klebt der Hover-Zustand
   sonst nach dem Tippen an der nachrückenden Karte ("bleibt gelb") */
@media(hover:hover){
  nav.tabs button:hover{background:var(--tile-hi);color:var(--chalk)}
  .person:hover{background:var(--tile-hi)}
  .answers button:hover{background:var(--tile-hi)}
  .a-gern:hover{background:var(--mustard)!important;color:#12262B!important}
  .a-nie:hover{background:var(--tomato)!important}
  .a-neu:hover{background:var(--sage)!important;color:#12262B!important}
  .duel button:hover{background:var(--mustard);color:#12262B}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost:hover{background:var(--tile-hi)}
  .slot .swap:hover{background:var(--tile-hi);color:var(--chalk)}
  .grip:hover{background:var(--tile-hi);color:var(--chalk)}
  .res:hover{background:var(--tile-hi)}
  .lunchoff:hover{border-color:rgba(243,238,226,.3);color:var(--dim)}
  .rev .mini button:hover{background:var(--tile-hi);color:var(--chalk)}
}
button:focus-visible,.person:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
@media (max-width:520px){
  .answers{grid-template-columns:repeat(2,1fr)}
  .duel{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
<header>
  <h1>Was gibt's<em>?</em></h1>
  <p class="sub">Jeder sichtet die Gerichteliste einmal durch, dann entscheidet die Familie – und nicht der Kühlschrank um 18 Uhr.</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
</div>

<script>
/* ---------- Daten ---------- */
// b = Basis, p = Protein, e = Aufwand 0-3 (0 = wird geliefert), t = Tags,
// w = kindgerechte Erklärung ("Was ist das?"), z = Hauptzutaten (Einkaufsliste)
// Die Gerichteliste liegt in dishes.json (siehe README: nur ans Ende anfügen,
// nie mittendrin einfügen oder löschen; ausmustern per "aus": true).
let DALL=[];   // alle Gerichte, Position = feste id (auch ausgemusterte)
let D=[];      // nur aktive Gerichte, überall in der Oberfläche verwendet
async function loadDishes(){
  const res=await fetch("dishes.json",{cache:"no-cache"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  DALL=(await res.json()).map((d,i)=>({id:i,t:[],...d}));
  D=DALL.filter(d=>!d.aus);
}

const PEOPLE=[
  {id:"felix",name:"Felix"},
  {id:"jakob",name:"Jakob"},
  {id:"moritz",name:"Moritz"},
  {id:"kathrin",name:"Kathrin"},
  {id:"dominik",name:"Dominik"}
];

// Vorbelegte Vetos aus dem, was ihr schon wisst – spart 30 Klicks pro Kind.
const SEED_NIE={
  felix:d=>d.p==="huhn"||d.p==="fisch",
  moritz:d=>d.p==="fisch"||d.t.includes("sushi")||d.t.includes("steak"),
  jakob:()=>false,
  kathrin:()=>false,
  dominik:()=>false
};
const SEED_GERN={
  felix:["Pulled-Pork-Burger","Cheeseburger selbst gemacht","Pommes mit drei Dips","Käsebrot mit Gurke und Karotte","Gurken-Avocado-Maki","Nudeln mit Hackfleischsauce","Flammkuchen klassisch","Kaiserschmarren mit Apfelmus","Wraps mit Gurke und Tomate","Spätzle mit Rahmsauce"],
  jakob:["Lachs-Nigiri und -Maki","Rumpsteak mit Kräuterbutter","Nudeln mit Hackfleischsauce","Pizza Margherita","Flammkuchen klassisch","Kaiserschmarren mit Apfelmus","Apfelstrudel mit Vanillesauce","Wraps mit Hackfleisch und Gemüse","Spätzle mit Rahmsauce"],
  moritz:["Knusperhähnchen mit Pommes","Nudeln mit Tomatensauce","Pizza Margherita","Pommes mit drei Dips","Dampfnudeln mit Vanillesauce","Kaiserschmarren mit Apfelmus","Wraps mit Gurke und Tomate","Spätzle mit Rahmsauce"],
  kathrin:[],
  dominik:[]
};

/* ---------- Zustand ---------- */
const KEY="wasgibts:v2";
let S={ratings:{},elo:{},duels:{}};   // ratings[pid][did] = 'gern'|'ok'|'nie'|'neu'
let tab="start", who=null, mem={}, note="", reviewList=false, bestWho="alle";
let draft=null; // Wochenplan-Entwurf: [{id,pin}|null x9], lebt bis zum Übernehmen/Neuladen
let undoStack={}; // Sichtung: pro Person die selbst beantworteten Gerichte dieser Sitzung
let lastDuel=null; // letztes Duell für "Zurücknehmen" (eine Stufe)

function fresh(){
  S.paused=S.paused||{};   // global pausierte Gerichte (Gerät fehlt o.ä.), id -> true
  S.dcnt=S.dcnt||{};       // Duelle pro Person und Gericht (Gerät-lokal, nicht im Code)
  S.history=S.history||[]; // Gericht-IDs der letzten übernommenen Wochenpläne
  S.lunch=S.lunch||{};     // Werktage mit Mittagessen-Slot (0=Mo ... 4=Fr)
  // Migration: bis v1.7 war der übernommene Plan ein festes 9er-Array von IDs
  if(S.plan&&S.plan.ids&&!S.plan.slots){
    S.plan={slots:S.plan.ids.map((id,i)=>id!=null?{l:SLOTS9[i],id}:{l:SLOTS9[i]})};
  }
  PEOPLE.forEach(p=>{
    S.ratings[p.id]=S.ratings[p.id]||{};
    S.elo[p.id]=S.elo[p.id]||{};
    S.dcnt[p.id]=S.dcnt[p.id]||{};
    S.duels[p.id]=S.duels[p.id]||0;
    D.forEach(d=>{
      if(S.ratings[p.id][d.id]) return;
      if(SEED_NIE[p.id](d)) S.ratings[p.id][d.id]="nie";
      else if(SEED_GERN[p.id].includes(d.n)) S.ratings[p.id][d.id]="gern";
    });
  });
}
/* Persistenz: localStorage, mit In-Memory-Rückfallebene falls der Browser
   sie blockiert (Privatmodus, eingebettetes iframe ohne Storage Access). */
let canStore=(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}})();
function load(){
  const raw = canStore ? localStorage.getItem(KEY) : mem[KEY];
  if(raw){ try{ S=JSON.parse(raw); }catch(e){} }
  if(S.ratings&&S.ratings.eltern){ // Migration: bis v1.1 gab es "Eltern" als gemeinsame Person
    ["kathrin","dominik"].forEach(pid=>{
      if(!S.ratings[pid]||!Object.keys(S.ratings[pid]).length) S.ratings[pid]={...S.ratings.eltern};
      if(!S.elo[pid]) S.elo[pid]={...(S.elo.eltern||{})};
      if(S.duels[pid]===undefined) S.duels[pid]=S.duels.eltern||0;
    });
    delete S.ratings.eltern; delete S.elo.eltern; delete S.duels.eltern;
  }
  fresh();
  if(typeof S.seen==="number" && DALL.length>S.seen){
    const n=DALL.length-S.seen;
    note=n+(n===1?" neues Gericht":" neue Gerichte")+" in der Liste – sie tauchen bei der Sichtung automatisch auf.";
  }
  S.seen=DALL.length; save();
  importFromHash();
}
function save(){
  const v=JSON.stringify(S); mem[KEY]=v;
  if(canStore){ try{ localStorage.setItem(KEY,v); }catch(e){ canStore=false; } }
}

/* ---------- Übertragung: Zustand als kurzer Code ---------- */
const B64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const ST=[null,"gern","ok","nie","neu"];
/* Format v3: statt eines Listen-Hashs steht die Gerichtezahl im Code. Die Liste
   darf dadurch wachsen (nur ans Ende anfügen!): ein Code von einer älteren,
   kürzeren Liste bleibt lesbar, die neuen Gerichte sind einfach unbewertet. */
/* Personen-Code: eine Person. Familien-Code (Personen-Index 7): alle Personen in
   einem Code – damit wandert der Gesamtstand vom Tablet zurück auf alle Geräte. */
function bitsPerson(push,pid){
  push(Math.min(S.duels[pid]||0,63),6);
  DALL.forEach(d=>push(ST.indexOf(S.ratings[pid][d.id]||null),3));
  const top=[...D].sort((a,b)=>(S.elo[pid][b.id]||1000)-(S.elo[pid][a.id]||1000)).slice(0,8);
  for(let i=0;i<8;i++) push(top[i]?top[i].id:511,9);
}
function toB64(bits){
  while(bits.length%6) bits.push(0);
  let out="";
  for(let i=0;i<bits.length;i+=6){ let v=0; for(let j=0;j<6;j++) v=v*2+bits[i+j]; out+=B64[v]; }
  return out;
}
function encode(pid){
  const pi=PEOPLE.findIndex(p=>p.id===pid);
  const bits=[];
  const push=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>i)&1); };
  push(3,4); push(pi,3); push(DALL.length,9);
  bitsPerson(push,pid);
  return toB64(bits);
}
function encodeFamily(){
  const bits=[];
  const push=(v,n)=>{ for(let i=n-1;i>=0;i--) bits.push((v>>i)&1); };
  push(3,4); push(7,3); push(DALL.length,9); push(PEOPLE.length,3);
  PEOPLE.forEach(p=>bitsPerson(push,p.id));
  // Pausierte Gerichte hinten anhängen. Alte Decoder ignorieren die Extra-Bits,
  // alte Codes lesen hier nur Null-Padding und ergeben 0 pausierte Gerichte.
  const paused=Object.keys(S.paused||{}).filter(id=>S.paused[id]&&DALL[id]).slice(0,511);
  push(paused.length,9);
  paused.forEach(id=>push(+id,9));
  return toB64(bits);
}
function decode(code){
  code=code.trim().replace(/\s+/g,"");
  const bits=[];
  for(const c of code){ const v=B64.indexOf(c); if(v<0) throw new Error("Der Code enthält ungültige Zeichen."); for(let i=5;i>=0;i--) bits.push((v>>i)&1); }
  let k=0; const take=n=>{ let v=0; for(let i=0;i<n;i++) v=v*2+(bits[k++]||0); return v; };
  if(take(4)!==3) throw new Error("Der Code stammt aus einer anderen Version der App. Auf beiden Geräten die Seite neu laden, Code neu erzeugen.");
  const pi=take(3), n=take(9);
  if(n>DALL.length) throw new Error("Der Code stammt von einer neueren Gerichteliste. Dieses Gerät erst neu laden, dann einlesen.");
  const takePerson=()=>{
    const du=take(6), r={};
    for(let i=0;i<n;i++){ const v=take(3); if(ST[v]) r[i]=ST[v]; }
    const elo={}; for(let i=0;i<8;i++){ const id=take(9); if(DALL[id]&&!DALL[id].aus) elo[id]=1200-i*25; }
    return {ratings:r,elo,duels:du};
  };
  if(pi===7){
    const pc=take(3);
    if(pc!==PEOPLE.length) throw new Error("Der Familien-Code passt nicht zur Personenliste dieser Version.");
    const people=PEOPLE.map(p=>({pid:p.id,...takePerson()}));
    const paused={}, pn=take(9);
    for(let i=0;i<pn;i++){ const id=take(9); if(DALL[id]) paused[id]=true; }
    return {family:true,n,people,paused};
  }
  if(!PEOPLE[pi]) throw new Error("Unbekannte Person im Code.");
  return {family:false,n,pid:PEOPLE[pi].id,...takePerson()};
}
function applyCode(code){
  const p=decode(code);
  (p.family?p.people:[p]).forEach(q=>{
    const mine=S.ratings[q.pid]||{};
    // Nur Gerichte anfassen, die der Code kennt; danach ergänzte behalten ihren Stand.
    for(let i=0;i<p.n;i++){ if(q.ratings[i]) mine[i]=q.ratings[i]; else delete mine[i]; }
    S.ratings[q.pid]=mine; S.elo[q.pid]=q.elo; S.duels[q.pid]=q.duels;
  });
  if(p.family) S.paused=p.paused||{};
  fresh(); save();
  return p.family?"Familien-Code, alle Personen":PEOPLE.find(x=>x.id===p.pid).name;
}
function importFromHash(){
  const h=location.hash.replace(/^#c=/,"");
  if(!h||h===location.hash) return;
  try{ note="Eingelesen: "+applyCode(h); }
  catch(e){ note="Konnte nicht einlesen: "+e.message; }
  history.replaceState(null,"",location.pathname+location.search);
}

/* ---------- Hilfen ---------- */
function shuffled(pid){
  // stabile Reihenfolge pro Person
  let seed=[...pid].reduce((a,c)=>a+c.charCodeAt(0),7);
  const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  return [...D].map(d=>[rnd(),d]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
const rated=pid=>D.filter(d=>S.ratings[pid][d.id]).length;
const queue=pid=>shuffled(pid).filter(d=>!S.ratings[pid][d.id]);
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const BASE={nudeln:"Nudeln",spaetzle:"Spätzle",teig:"Teig",brot:"Brot",kartoffel:"Kartoffel",reis:"Reis",suppe:"Suppe",suess:"Süßspeise",sonst:"Ohne feste Basis"};

function analyse(){
  const kids=["felix","jakob","moritz"];
  return D.map(d=>{
    const r={},pts=[];
    PEOPLE.forEach(p=>{
      const v=S.ratings[p.id][d.id]||null; r[p.id]=v;
      if(v==="gern")pts.push(2); else if(v==="ok")pts.push(1); else if(v==="neu")pts.push(.5);
    });
    const veto=PEOPLE.filter(p=>r[p.id]==="nie").map(p=>p.name);
    // Bis zu drei Vetos blockieren nicht (Extrawurst), kosten aber je 1,5 Punkte -
    // Mehrfach-Veto-Gerichte kommen so vor, aber selten. Ab vier Vetos ist das
    // Gericht raus (Konsumenten filtern veto.length>3).
    const sum=pts.reduce((a,b)=>a+b,0)-1.5*veto.length;
    const min=pts.length?Math.min(...pts):0;
    const elo=PEOPLE.reduce((a,p)=>a+((S.elo[p.id][d.id]||1000)-1000),0)/400;
    const neu=kids.some(k=>r[k]==="neu")&&!veto.length;
    return {d,r,veto,sum:sum+elo,min,neu,done:PEOPLE.filter(p=>r[p.id]).length};
  });
}
// Saison: "sommer"-Gerichte nicht Nov-Mär, "winter"-Gerichte nicht Mai-Sep
function inSeason(d,m){
  m=m||new Date().getMonth()+1;
  if(d.t.includes("sommer")&&(m<=3||m>=11))return false;
  if(d.t.includes("winter")&&m>=5&&m<=9)return false;
  return true;
}

/* ---------- Ansichten ---------- */
function render(){
  const tabs=document.getElementById("tabs");
  const T=[["start","Wer ist dran"],["sichten","Sichtung"],["duell","Turnier"],["teilen","Übertragen"],["ergebnis","Ergebnis"],["plan","Wochenplan"]];
  tabs.innerHTML="";
  T.forEach(([k,l])=>{
    const b=el(`<button role="tab" aria-selected="${tab===k}">${l}</button>`);
    b.onclick=()=>{tab=k;reviewList=false;render();};
    tabs.appendChild(b);
  });
  const v=document.getElementById("view"); v.innerHTML="";
  if(note){const b=el(`<div class="notice">${esc(note)}</div>`);v.appendChild(b);note="";}
  ({start:vStart,sichten:vSichten,duell:vDuell,teilen:vTeilen,ergebnis:vErgebnis,plan:vPlan})[tab](v);
}

function vStart(v){
  v.appendChild(el(`<p class="muted">Jeder geht die ${D.length} Gerichte einmal durch und sagt bei jedem: gern, geht so, nie, oder kenn ich nicht. Was ihr schon sicher wisst, ist vorbelegt. Meinung geändert? Unter „Sichtung“ lässt sich jede Bewertung nachträglich umstellen.</p>`));
  const g=el(`<div class="people"></div>`);
  PEOPLE.forEach(p=>{
    const n=rated(p.id), pc=Math.round(n/D.length*100);
    const gern=D.filter(d=>S.ratings[p.id][d.id]==="gern").length;
    const rem=Math.max(0,Math.min(30,gern)-(S.duels[p.id]||0));
    const hint=n<D.length?"":rem>0?` · noch ~${rem} Duelle empfohlen`:" · Ranking stabil";
    const b=el(`<button class="person"><span class="nm">${p.name}</span><div class="bar"><i style="width:${pc}%"></i></div><span class="st">${n} von ${D.length} · ${S.duels[p.id]||0} Duelle${hint}</span></button>`);
    b.onclick=()=>{who=p.id;reviewList=false;tab=n<D.length?"sichten":"duell";render();};
    g.appendChild(b);
  });
  v.appendChild(g);
  const row=el(`<div class="row"></div>`);
  const rst=el(`<button class="btn ghost">Alles zurücksetzen</button>`);
  rst.onclick=()=>{if(confirm("Alle Bewertungen löschen?")){S={ratings:{},elo:{},duels:{}};fresh();save();render();}};
  row.appendChild(rst); v.appendChild(row);
}

function vSichten(v){
  if(!who){v.appendChild(el(`<div class="empty">Wähle oben unter „Wer ist dran“ aus, wer gerade sichtet.</div>`));return;}
  if(reviewList){vRevidieren(v);return;}
  const q=queue(who), p=PEOPLE.find(x=>x.id===who);
  if(!q.length){
    v.appendChild(el(`<div class="empty">${p.name} ist durch – alle ${D.length} bewertet. Weiter zum Turnier.</div>`));
    const b=el(`<div class="row"><button class="btn">Zum Turnier</button><button class="btn ghost">Bewertungen ändern</button></div>`);
    b.children[0].onclick=()=>{tab="duell";render();};
    b.children[1].onclick=()=>{reviewList=true;render();};
    v.appendChild(b); return;
  }
  const d=q[0], done=D.length-q.length;
  v.appendChild(el(`<div class="progress"><span>${p.name}</span><span>${done} von ${D.length}</span></div>`));
  v.appendChild(el(`<div class="bar"><i style="width:${done/D.length*100}%"></i></div>`));
  const chips=[BASE[d.b],d.e?"Aufwand "+"●".repeat(d.e):"wird geliefert"].concat(d.t.includes("bauteil")?["zum Selbstbauen"]:[]);
  v.appendChild(el(`<div class="card" style="margin-top:16px"><p class="dish">${esc(d.n)}</p>${d.w?`<p class="what"><b>Was ist das?</b> ${esc(d.w)}</p>`:""}<div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>`));
  const a=el(`<div class="answers">
    <button class="a-gern"><span>★</span>Gern</button>
    <button><span>~</span>Geht so</button>
    <button class="a-nie"><span>✕</span>Nie</button>
    <button class="a-neu"><span>?</span>Kenn ich nicht</button></div>`);
  ["gern","ok","nie","neu"].forEach((val,i)=>{
    a.children[i].onclick=()=>{
      S.ratings[who][d.id]=val;
      if(val!=="gern"){ delete S.elo[who][d.id]; delete S.dcnt[who][d.id]; }
      (undoStack[who]=undoStack[who]||[]).push(d.id);
      save();render();
    };
  });
  v.appendChild(a);
  const back=el(`<div class="row"><button class="btn ghost">Letzte Antwort ändern</button><button class="btn ghost">Bewertungen ändern</button><button class="btn ghost">Pause, anderer ist dran</button></div>`);
  // Nimmt exakt die eigene letzte Antwort dieser Sitzung zurück - nicht einfach
  // die zuletzt bewertete Karte in der Reihenfolge (das traf früher auch
  // vorbelegte Seed-Bewertungen und wirkte deshalb unzuverlässig)
  back.children[0].onclick=()=>{
    const u=undoStack[who];
    if(u&&u.length){ delete S.ratings[who][u.pop()]; save(); render(); }
    else{ note="Nichts zum Zurücknehmen in dieser Sitzung. Ältere Antworten über „Bewertungen ändern“."; render(); }
  };
  back.children[1].onclick=()=>{reviewList=true;render();};
  back.children[2].onclick=()=>{who=null;tab="start";render();};
  v.appendChild(back);
}

/* Alle Bewertungen einer Person ansehen und einzeln umstellen */
function vRevidieren(v){
  const p=PEOPLE.find(x=>x.id===who);
  v.appendChild(el(`<div class="progress"><span>${p.name}: Bewertungen ändern</span><span>${rated(who)} von ${D.length}</span></div>`));
  v.appendChild(el(`<p class="muted">Tippe bei einem Gericht auf ★ gern, ~ geht so, ✕ nie oder ? kenn ich nicht. Die Änderung gilt sofort. Stufst du einen Favoriten herunter, fliegt er aus dem Turnier-Ranking; neue Favoriten kommen bei den nächsten Duellen zuerst dran.</p>`));
  const back=el(`<div class="row"><button class="btn">Zurück zur Sichtung</button></div>`);
  back.firstChild.onclick=()=>{reviewList=false;render();};
  v.appendChild(back);
  const search=el(`<input class="searchbox" type="search" placeholder="Gericht suchen …">`);
  v.appendChild(search);
  const box=el(`<div></div>`); v.appendChild(box);
  const VALS=["gern","ok","nie","neu"], SYM=["★","~","✕","?"];
  const groups={};
  D.forEach(d=>{(groups[d.b]=groups[d.b]||[]).push(d);});
  Object.keys(groups).forEach(b=>{
    const h=el(`<h3>${BASE[b]}</h3>`); box.appendChild(h);
    groups[b].forEach(d=>{
      const cur=S.ratings[who][d.id];
      const row=el(`<div class="rev" data-n="${esc(d.n).toLowerCase()}"><span class="nm">${esc(d.n)}</span><span class="mini"></span></div>`);
      const mini=row.querySelector(".mini");
      VALS.forEach((val,i)=>{
        const btn=el(`<button aria-label="${val}" class="${cur===val?"on-"+val:""}">${SYM[i]}</button>`);
        btn.onclick=()=>{
          S.ratings[who][d.id]=val;
          // Heruntergestufte Favoriten fliegen aus dem Turnier-Ranking;
          // neu hochgestufte kommen im Turnier zuerst dran (Duellzähler 0)
          if(val!=="gern"){ delete S.elo[who][d.id]; delete S.dcnt[who][d.id]; }
          save();
          [...mini.children].forEach((c,j)=>c.className=VALS[j]===val?"on-"+val:"");
        };
        mini.appendChild(btn);
      });
      box.appendChild(row);
    });
  });
  search.oninput=()=>{
    const t=search.value.trim().toLowerCase();
    box.querySelectorAll(".rev").forEach(r=>{r.style.display=!t||r.dataset.n.includes(t)?"":"none";});
    box.querySelectorAll("h3").forEach(h=>{
      let el2=h.nextElementSibling, any=false;
      while(el2&&el2.classList.contains("rev")){ if(el2.style.display!=="none")any=true; el2=el2.nextElementSibling; }
      h.style.display=any?"":"none";
    });
  };
}

function vDuell(v){
  if(!who){v.appendChild(el(`<div class="empty">Wähle zuerst aus, wer dran ist.</div>`));return;}
  const p=PEOPLE.find(x=>x.id===who);
  const pool=D.filter(d=>S.ratings[who][d.id]==="gern");
  if(pool.length<4){v.appendChild(el(`<div class="empty">${p.name} hat noch zu wenige Lieblingsgerichte für ein Turnier. Erst weiter sichten.</div>`));return;}
  v.appendChild(el(`<p class="muted">Beide Gerichte mag ${p.name}. Welches lieber? Das sortiert die Favoriten untereinander – 15 bis 20 Duelle reichen.</p>`));
  v.appendChild(el(`<div class="progress"><span>${p.name}</span><span>${S.duels[who]||0} Duelle gespielt</span></div>`));
  const cnt=d=>S.dcnt[who][d.id]||0;
  const fresh0=pool.filter(d=>cnt(d)===0).length;
  if(fresh0) v.appendChild(el(`<p class="muted">${fresh0} Favorit${fresh0===1?" war":"en waren"} noch nie im Duell (neu bewertet oder revidiert) – die kommen zuerst dran.</p>`));
  // Nachzügler zuerst: einer der beiden Kandidaten kommt aus den am wenigsten geduellten
  const pick=()=>{
    const sorted=[...pool].sort((a,b)=>cnt(a)-cnt(b)||Math.random()-.5);
    const a=sorted[Math.floor(Math.random()*Math.min(3,sorted.length))];
    let b;do{b=pool[Math.floor(Math.random()*pool.length)];}while(b===a);
    return [a,b];
  };
  const [x,y]=pick();
  const g=el(`<div class="duel"><button>${esc(x.n)}</button><button>${esc(y.n)}</button></div>`);
  const win=(w,l)=>{
    const E=S.elo[who];
    // Vorherigen Zustand für "Zurücknehmen" sichern (undefined = gab keinen Eintrag)
    lastDuel={who,w:w.id,l:l.id,ew:E[w.id],el:E[l.id],wn:w.n,ln:l.n};
    const rw=E[w.id]||1000, rl=E[l.id]||1000;
    const exp=1/(1+Math.pow(10,(rl-rw)/400));
    E[w.id]=rw+32*(1-exp); E[l.id]=rl-32*(1-exp);
    S.dcnt[who][w.id]=(S.dcnt[who][w.id]||0)+1;
    S.dcnt[who][l.id]=(S.dcnt[who][l.id]||0)+1;
    S.duels[who]=(S.duels[who]||0)+1; save(); render();
  };
  g.children[0].onclick=()=>win(x,y);
  g.children[1].onclick=()=>win(y,x);
  v.appendChild(g);
  const r=el(`<div class="row"><button class="btn ghost">Fertig, nächste Person</button><button class="btn">Ergebnis ansehen</button></div>`);
  r.children[0].onclick=()=>{who=null;tab="start";render();};
  r.children[1].onclick=()=>{tab="ergebnis";render();};
  v.appendChild(r);
  if(lastDuel&&lastDuel.who===who){
    const u=el(`<div class="row"><button class="btn ghost">↶ Letztes Duell zurücknehmen (${esc(lastDuel.wn)} vor ${esc(lastDuel.ln)})</button></div>`);
    u.firstChild.onclick=()=>{
      const E=S.elo[who], ld=lastDuel;
      if(ld.ew===undefined) delete E[ld.w]; else E[ld.w]=ld.ew;
      if(ld.el===undefined) delete E[ld.l]; else E[ld.l]=ld.el;
      [ld.w,ld.l].forEach(id=>{ if(--S.dcnt[who][id]<=0) delete S.dcnt[who][id]; });
      S.duels[who]=Math.max(0,(S.duels[who]||0)-1);
      lastDuel=null; save();
      note="Duell zurückgenommen."; render();
    };
    v.appendChild(u);
  }
  const rst=el(`<div class="row"><button class="btn ghost">Turnier von ${p.name} neu starten</button></div>`);
  rst.firstChild.onclick=()=>{
    if(confirm(`Alle Duell-Ergebnisse von ${p.name} löschen und neu anfangen?`)){
      S.elo[who]={};S.dcnt[who]={};S.duels[who]=0;lastDuel=null;save();render();
    }
  };
  v.appendChild(rst);
}

function vTeilen(v){
  v.appendChild(el(`<p class="muted">Es läuft nichts über einen Server – Stände wandern per QR-Code, Link oder abgetipptem Code direkt von Gerät zu Gerät.</p>`));

  v.appendChild(foldEl("Anleitung: So läuft es ab",false,el(`<ol class="steps">
    <li><b>Jeder für sich:</b> auf dem eigenen Gerät sichten und Duelle spielen.</li>
    <li><b>Abgeben:</b> jeder erzeugt unten seinen Code, das Tablet liest alle nacheinander ein. Die Reihenfolge ist egal – jeder Code ändert nur die eigene Person.</li>

function backupJson(){
  return JSON.stringify({app:"wasgibts",v:2,dishes:DALL.length,ts:new Date().toISOString(),state:S});
}
function restoreBackup(text){
  const b=JSON.parse(text);
  if(b.app!=="wasgibts"||!b.state||!b.state.ratings) throw new Error("Das ist keine Was-gibt's-Sicherung.");
  if(b.dishes>DALL.length) throw new Error("Die Sicherung stammt von einer neueren Gerichteliste. Erst die Seite aktualisieren.");
  S=b.state; fresh(); save(); draft=null;
  return (b.ts||"").slice(0,10)||"unbekannt";
}

async function scan(v){
  if(!("BarcodeDetector" in window)){ note="Dieser Browser kann keine QR-Codes scannen. Nimm die Kamera-App oder tippe den Code ab."; render(); return; }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); }
  catch(e){ note="Kein Kamerazugriff. Nimm die Kamera-App oder tippe den Code ab."; render(); return; }
  const vid=el(`<video playsinline style="width:100%;border-radius:3px;margin-top:8px"></video>`);
  v.appendChild(vid); vid.srcObject=stream; await vid.play();
  const det=new BarcodeDetector({formats:["qr_code"]});
  const stop=()=>stream.getTracks().forEach(t=>t.stop());
  const tick=async()=>{
    if(!vid.isConnected){ stop(); return; }
    try{
      const found=await det.detect(vid);
      if(found.length){
        stop();
        const m=found[0].rawValue.match(/#c=(.+)$/);
        try{ note="Eingelesen: "+applyCode(m?m[1]:found[0].rawValue); }catch(e){ note=e.message; }
        render(); return;
      }
    }catch(e){}
    requestAnimationFrame(tick);
  };
  tick();
}

const WDAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
// Slot-Liste dynamisch: Werktage optional mit Mittagessen (S.lunch), Sa/So immer Mittag+Abend
function slotDefs(){

const extraFor=id=>PEOPLE.filter(p=>S.ratings[p.id][id]==="nie").map(p=>p.name);
// Vorschlag fürs Extrawurst-Essen: einfach, verfügbar, und alle Veto-Leute
// mögen es "gern" oder "geht so" (gern bevorzugt, Duell-Elo als Feinsortierung)
function extraSuggestion(vetoNames,excludeId){
  const pids=PEOPLE.filter(p=>vetoNames.includes(p.name)).map(p=>p.id);
  if(!pids.length)return null;
  const cand=D.filter(d=>d.id!==excludeId&&!S.paused[d.id]&&inSeason(d)&&d.e>0&&d.e<=2
    &&pids.every(pid=>["gern","ok"].includes(S.ratings[pid][d.id])));
  if(!cand.length)return null;
  const score=d=>pids.reduce((a,pid)=>a+(S.ratings[pid][d.id]==="gern"?2:1)+((S.elo[pid][d.id]||1000)-1000)/400,0);
  return cand.sort((a,b)=>score(b)-score(a))[0];
}

    const ex=extraFor(d.id);

    return s.l+": "+d.n+(ex.length?" (Extrawurst für "+ex.join(", ")+(sug?": z.B. "+sug.n:"")+")":"");
  }).join("\n");
}

/* ---------- Zufriedenheit mit einem Plan ---------- */
// Wie gut trifft ein Plan jede einzelne Person? gern = 2, geht so = 1,
// kenn ich nicht / unbewertet = 0,75, Veto = 0,5 (es gibt zwar eine Extrawurst,
// aber das Familienessen ist es trotzdem nicht). 100 % = überall "gern".
const HAPPY={gern:2,ok:1,neu:.75,nie:.5};
function happyOf(ids){
  return PEOPLE.map(p=>{
    let sum=0,g=0,ok=0,q=0,nie=0;
    ids.forEach(id=>{
      const r=S.ratings[p.id][id]||"neu";
      sum+=HAPPY[r]!==undefined?HAPPY[r]:.75;
      if(r==="gern")g++; else if(r==="ok")ok++; else if(r==="nie")nie++; else q++;
    });
    return {p,pct:ids.length?Math.round(sum/(2*ids.length)*100):0,g,ok,q,nie};
  });
}
const happyAvg=ids=>{const h=happyOf(ids);return Math.round(h.reduce((a,x)=>a+x.pct,0)/h.length);};
// Kasten über dem Plan: pro Person ein Balken, dazu die Werte der letzten
// übernommenen Pläne - damit sich ein schwacher Wert nächste Woche ausgleichen lässt.
function happyBox(ids,skip){
  const box=el(`<div class="happy"></div>`);
  const h=happyOf(ids), past=(S.history||[]).slice(skip||0,(skip||0)+3).map(x=>happyOf(x));
  box.appendChild(el(`<div class="hhead">Wie happy ist die Familie? <b>Ø ${ids.length?happyAvg(ids):0} %</b> <span>(${ids.length} Essen)</span></div>`));
  const low=Math.min(...h.map(x=>x.pct));
  h.forEach((x,i)=>{
    const parts=[];
    if(x.g)parts.push(x.g+"× gern");
    if(x.ok)parts.push(x.ok+"× geht so");
    if(x.q)parts.push(x.q+"× unbekannt");
    if(x.nie)parts.push(x.nie+"× 🌭 Extrawurst");
    const tr=past.map(pp=>pp[i].pct+" %").join(" · ");
    box.appendChild(el(`<div class="hrow${ids.length&&x.pct===low?" low":""}"><span class="hnm">${x.p.name}</span><span class="bar"><i style="width:${x.pct}%"></i></span><span class="hpct">${x.pct} %</span><span class="hmeta">${parts.join(" · ")||"nichts verplant"}${tr?" · zuletzt "+tr:""}</span></div>`));
  });
  if(ids.length){
    const names=h.filter(x=>x.pct===low).map(x=>x.p.name);
    const prev=past[0];
    const again=prev&&h.some((x,i)=>x.pct===low&&prev[i].pct===Math.min(...prev.map(y=>y.pct)));
    box.appendChild(el(`<p class="hnote">${names.join(" und ")} ${names.length>1?"kommen":"kommt"} in diesem Plan am kürzesten weg (${low} %).${again?" Das war im letzten Plan schon so – jetzt oder nächste Woche gezielt ein Lieblingsgericht einbauen.":" Beim Ersetzen steht neben jedem Vorschlag, wie er den Familien-Schnitt verändert."}</p>`));
  }
  return box;
}
// Tageszeilen aus den Slot-Beschriftungen: "Montag Mittag"/"Montag Abend"/"Montag"
// landen in einer Zeile. Funktioniert für Entwurf und übernommenen Plan gleich.
function groupSlots(labels){
  const out=[];
  labels.forEach((l,i)=>{
    const m=l.match(/^(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)/);
    const name=m?m[1]:l;
    let g=out.find(x=>x.name===name);
    if(!g){g={name,lunch:null,dinner:null};out.push(g);}
    if(/Mittag$/.test(l))g.lunch=i; else g.dinner=i;
  });
  return out;
}

  // Übernommener Plan: feste Ansicht mit Teilen + Einkaufsliste
  if(S.plan){
    const PS=S.plan.slots;
    const planIdsFixed=PS.filter(s=>!s.reste&&s.id!=null).map(s=>s.id);
    v.appendChild(el(`<p class="muted">Dieser Plan ist übernommen und bleibt so stehen, bis ihr einen neuen macht.</p>`));
    v.appendChild(happyBox(planIdsFixed,1)); // Verlauf[0] ist dieser Plan selbst
    const card=(s,lunch)=>{
      const cls="slot"+(lunch?" mit":"");
      if(s.reste) return el(`<div class="${cls}"><div class="day">${shortLabel(s.l)}</div><div class="dish">Reste vom Vorabend</div><div class="tag">aus dem Kühlschrank · Aufwand 0</div></div>`);
      const d=s.id!=null?DALL[s.id]:null;
      const ex=d?extraFor(d.id):[];
      const sug=ex.length?extraSuggestion(ex,d.id):null;
      const exLine=ex.length?`<div class="ex">🌭 <b>${ex.join(" und ")}</b> ${ex.length>1?"bekommen":"bekommt"} stattdessen: ${sug?esc(sug.n):"eigenes Essen wählen"}</div>`:"";
      return el(`<div class="${cls}"><div class="day">${shortLabel(s.l)}</div><div class="dish">${d?esc(d.n):"–"}</div><div class="tag">${d?BASE[d.b]+" · "+(d.e?"Aufwand "+"●".repeat(d.e):"geliefert"):""}</div>${exLine}</div>`);
    };
    const box=el(`<div class="plan"></div>`);
    groupSlots(PS.map(s=>s.l)).forEach(g=>{
      box.appendChild(dayRowEl(g.name,g.lunch!=null?card(PS[g.lunch],true):null,g.dinner!=null?card(PS[g.dinner],false):el(`<div></div>`)));
    });
    v.appendChild(box);
    const r=el(`<div class="row"><button class="btn">Plan teilen</button><button class="btn ghost">✎ Plan bearbeiten</button><button class="btn ghost">Neuen Plan machen</button></div>`);
    r.children[0].onclick=()=>shareText(planText(PS),"Plan kopiert – einfach in die Familien-Gruppe einfügen.");
    // Bearbeiten: der Plan geht als gepinnter Entwurf zurück in die Bearbeitung.
    // Der beim Übernehmen gemerkte Verlauf-Eintrag fliegt raus, sonst zählt
    // dieselbe Woche nach dem erneuten Übernehmen doppelt.
    r.children[1].onclick=()=>{
      const by={}; PS.forEach(s=>by[s.l]=s);
      S.lunch={}; WDAYS.forEach((d,i)=>{if(by[d+" Mittag"])S.lunch[i]=true;});
      draft=slotDefs().map(df=>{
        const s=by[df.l]; if(!s)return null;
        if(s.reste)return {reste:1,pin:true};
        return s.id!=null?{id:s.id,pin:true,man:1}:null;
      });
      S.history=(S.history||[]).slice(1);
      S.plan=null; save();
      note="Plan zum Bearbeiten geöffnet – alle Plätze sind gepinnt, bis ihr sie löst.";
      render();
    };
    r.children[2].onclick=()=>{S.plan=null;save();draft=null;render();};
    v.appendChild(r);

    v.appendChild(el(`<h3>Einkaufsliste</h3>`));
    const items={},noz=[],liefer=[];
    PS.forEach(s=>{
      const d=!s.reste&&s.id!=null?DALL[s.id]:null; if(!d)return;
      if(d.t.includes("liefern")){liefer.push(d.n);return;}
      if(d.z)d.z.forEach(z=>items[z]=(items[z]||0)+1); else noz.push(d.n);
    });
    const lines=Object.keys(items).sort((a,b)=>a.localeCompare(b,"de")).map(z=>(items[z]>1?items[z]+"× ":"")+z);
    const ul=el(`<ul class="shop"></ul>`);
    lines.forEach(l=>ul.appendChild(el(`<li>${esc(l)}</li>`)));
    v.appendChild(ul);
    const sugs=[];
    PS.forEach(s=>{
      const d=!s.reste&&s.id!=null?DALL[s.id]:null; if(!d)return;
      const ex=extraFor(d.id); if(!ex.length)return;
      const sug=extraSuggestion(ex,d.id);
      if(sug)sugs.push(`${esc(s.l)}: ${esc(sug.n)} (für ${ex.join(", ")}${sug.z?" – "+sug.z.map(esc).join(", "):""})`);
    });
    if(sugs.length) v.appendChild(el(`<p class="muted">🌭 Extrawurst-Vorschläge dazu einkaufen:<br>${sugs.join("<br>")}</p>`));
    if(liefer.length) v.appendChild(el(`<p class="muted">Wird geliefert: ${liefer.map(esc).join(", ")}</p>`));
    if(noz.length) v.appendChild(el(`<p class="muted">Ohne Zutatenliste: ${noz.map(esc).join(", ")}</p>`));
    const r2=el(`<div class="row"><button class="btn ghost">Einkaufsliste teilen</button></div>`);
    r2.firstChild.onclick=()=>shareText("Einkauf für den Wochenplan:\n"+lines.map(l=>"- "+l).join("\n"),"Einkaufsliste kopiert.");
    v.appendChild(r2);
    return;
  }

  const allA=analyse();
  const outSeason=allA.filter(a=>a.veto.length<=3&&a.done>0&&!S.paused[a.d.id]&&!inSeason(a.d)).length;
  // Bis zu drei Vetos sind erlaubt (Extrawurst für die Veto-Leute), ab vier ist Schluss
  const A=allA.filter(a=>a.veto.length<=3&&a.done>0&&!S.paused[a.d.id]&&inSeason(a.d));
  if(A.length<12){v.appendChild(el(`<div class="empty">Zu wenig bewertet für einen Wochenplan. Mindestens eine Person sollte durch sein.</div>`));return;}
  const byId={}; A.forEach(a=>byId[a.d.id]=a);       // planbare Gerichte (Automatik zieht nur hieraus)
  const info={}; allA.forEach(a=>info[a.d.id]=a);    // alle aktiven Gerichte (auch handverlesene)
  const defs=slotDefs();
  const N=defs.length;
  // Grundlimits gelten für 9 Mahlzeiten; mit Mittag-Slots wachsen sie mit
  const CAP0={nudeln:2,spaetzle:1,teig:1,suess:1,suppe:1,kartoffel:2,reis:2,brot:2,sonst:3};
  const capOf=b=>Math.max(CAP0[b]||1,Math.round((CAP0[b]||1)*N/9));
  const klassiker=a=>/Pizza|Burger/.test(a.d.n)||a.d.t.includes("grillen");
  const sortedA=()=>[...A].sort((a,b)=>(b.min*2+b.sum)-(a.min*2+a.sum));
  const shuffle=arr=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
  // Wiederholungs-Bremse: Gerichte der letzten zwei übernommenen Pläne meiden
  // (Brotzeit und Wochenend-Klassiker dürfen sich wiederholen). Der Verlauf
  // selbst reicht weiter zurück - er trägt die Zufriedenheits-Werte.
  const pools=()=>{
    const sorted=sortedA();
    const hist=(S.history||[]).slice(0,2);
    let pool=[];
    for(let h=hist.length;h>=0;h--){
      const recent=new Set(hist.slice(0,h).flat());
      pool=sorted.filter(a=>!recent.has(a.d.id)||a.d.t.includes("brotzeit")||klassiker(a));
      if(pool.length>=20)break;
    }
    // Primär: die besten 44, gemischt. Reserve: der komplette Rest in
    // Qualitätsreihenfolge - damit ein Platz nie leer bleibt, nur weil die
    // Top-Gerichte an den Wochenregeln hängen
    const top=shuffle(pool.slice(0,44));
    const rest=pool.slice(44).concat(sorted.filter(a=>!pool.includes(a)));
    return {top,rest};
  };
  const planIds=()=>draft.map(e=>e&&e.id!=null?e.id:null);
  const usedOf=skip=>{
    const used={};let lief=0;
    draft.forEach((e,j)=>{
      const a=e&&!e.reste&&info[e.id]; if(!a||j===skip)return;
      // Brotzeit ist ein bewusster Wiederholungs-Baustein und zählt nicht
      // gegen das Brot-Limit (sonst blockiert die Brotzeit-Woche Burger & Co.)
      if(!a.d.t.includes("brotzeit")) used[a.d.b]=(used[a.d.b]||0)+1;
      if(a.d.t.includes("liefern"))lief++;
    });
    return {used,lief};
  };
  const fitsIn=skip=>a=>{
    const {used,lief}=usedOf(skip);
    if(!a.d.t.includes("brotzeit")&&(used[a.d.b]||0)>=capOf(a.d.b))return false;
    if(a.d.t.includes("liefern")&&lief>=1)return false;
    // Extrawurst-Grenzen: höchstens 2 Extrawurst-Essen pro Woche,
    // und niemand braucht zweimal pro Woche eine Extrawurst
    if(a.veto.length){
      const ex=draft.map((e,j)=>e&&j!==skip&&!e.reste&&info[e.id]).filter(x=>x&&x.veto.length);
      if(ex.length>=2||ex.some(x=>x.veto.some(n=>a.veto.includes(n))))return false;
    }
    return true;
  };
  const inDraft=a=>draft.some(e=>e&&e.id===a.d.id);
  // Vorabend-Abendessen für einen Mittag-Slot (für "Reste vom Vorabend")
  const prevDinner=i=>{
    if(defs[i].kind!=="lunch"||defs[i].day===0)return null;
    const j=defs.findIndex(df=>df.kind==="wd"&&df.day===defs[i].day-1);
    return j>=0&&draft[j]&&!draft[j].reste&&info[draft[j].id]?info[draft[j].id]:null;
  };
  const build=keep=>{
    draft=keep?keep.map(e=>e?(e.reste?e:(info[e.id]?e:null)):null):new Array(N).fill(null);
    if(draft.length!==N)draft=new Array(N).fill(null);
    const {top,rest}=pools();
    const free=pred=>{
      const f=fitsIn(-1);
      return top.find(a=>!inDraft(a)&&f(a)&&(!pred||pred(a)))
          ||rest.find(a=>!inDraft(a)&&f(a)&&(!pred||pred(a)));
    };
    const WEIDX=defs.map((df,i)=>df.kind==="we"?i:-1).filter(i=>i>=0);
    // 1) Brotzeit-Woche: zweimal Brotzeit abends auf Mo+Di oder Di+Mi
    if(S.brotwoche){
      const pat=Math.random()<.5?[0,1]:[1,2];
      for(const day of pat){
        const i=defs.findIndex(df=>df.kind==="wd"&&df.day===day);
        if(i<0||draft[i])continue;
        const a=free(z=>z.d.t.includes("brotzeit")); if(a)draft[i]={id:a.d.id,pin:false};
      }
    }
    // 2) Ein Wochenend-Klassiker: Pizza, Burger oder Grillen
    if(!draft.some(e=>e&&!e.reste&&info[e.id]&&klassiker(info[e.id]))){
      const k=free(klassiker);
      if(k){const s=WEIDX.filter(i=>!draft[i]);if(s.length)draft[s[Math.floor(Math.random()*s.length)]]={id:k.d.id,pin:false};}
    }
    // 3) Ein Experiment - aus dem GANZEN Entdeckungspool, nicht nur den Top 44.
    // Noch nie verplante Experimente werden bevorzugt (70%), aber nicht immer -
    // sonst zeigt jedes Neu-Würfeln dasselbe Experiment
    if(!draft.some(e=>e&&e.exp)){
      const f=fitsIn(-1);
      const neuAll=shuffle(A.filter(a=>a.neu&&!inDraft(a)&&f(a)));
      const hist=new Set((S.history||[]).flat());
      const freshNeu=neuAll.filter(a=>!hist.has(a.d.id));
      const x=(freshNeu.length&&Math.random()<.7?freshNeu:neuAll)[0];
      if(x){const s=WEIDX.find(i=>!draft[i]);const t=s!==undefined?s:draft.indexOf(null);if(t>=0)draft[t]={id:x.d.id,pin:false,exp:true};}
    }
    // 4) Wochenende zuerst füllen - hier sind die Kandidaten am knappsten
    for(const i of WEIDX){ if(draft[i])continue; const a=free(); if(a)draft[i]={id:a.d.id,pin:false}; }
    // 5) Werktags-Abende: einfache Gerichte zuerst (Aufwand höchstens 2)
    defs.forEach((df,i)=>{
      if(df.kind!=="wd"||draft[i])return;
      const a=free(z=>z.d.e>0&&z.d.e<=2)||free(); if(a)draft[i]={id:a.d.id,pin:false};
    });
    // 6) Werktags-Mittage: sehr einfach (Aufwand 1), manchmal Reste vom Vorabend
    defs.forEach((df,i)=>{
      if(df.kind!=="lunch"||draft[i])return;
      if(prevDinner(i)&&Math.random()<.35){draft[i]={reste:true,pin:false};return;}
      const a=free(z=>z.d.e===1)||free(z=>z.d.e>0&&z.d.e<=2)||free();
      if(a)draft[i]={id:a.d.id,pin:false};
    });
  };
  if(!draft||draft.length!==N) build();
  else draft=draft.map((e,i)=>{ // pausierte/ausgemusterte Gerichte fliegen raus, Reste nur auf Mittag-Slots
    if(!e)return null;
    if(e.reste)return defs[i].kind==="lunch"?e:null;
    if(!info[e.id]||S.paused[e.id])return null;
    // Handverlesenes bleibt auch außerhalb der Planungsliste stehen (Saison, Vetos)
    return (e.man||byId[e.id])?e:null;
  });
  const swap=i=>{
    const {top,rest}=pools(), cur=draft[i]&&!draft[i].reste&&info[draft[i].id], f=fitsIn(i);
    const cand=pred=>top.find(a=>!inDraft(a)&&f(a)&&(!pred||pred(a)))
                  ||rest.find(a=>!inDraft(a)&&f(a)&&(!pred||pred(a)));
    const kind=defs[i].kind, pin=draft[i]?draft[i].pin:false;
    // Mittag-Slot: Gericht -> ab und zu Reste, Reste -> Gericht
    if(kind==="lunch"&&!((draft[i]||{}).reste)&&prevDinner(i)&&Math.random()<.3){draft[i]={reste:true,pin};draw();return;}
    let a=null,keepExp=false;
    if(cur&&kind==="we"&&klassiker(cur)&&!draft.some((e,j)=>j!==i&&e&&!e.reste&&info[e.id]&&klassiker(info[e.id]))) a=cand(klassiker);
    else if(draft[i]&&draft[i].exp){ a=cand(z=>z.neu); if(a)keepExp=true; }
    if(!a) a=kind==="lunch"?(cand(z=>z.d.e===1)||cand(z=>z.d.e>0&&z.d.e<=2)||cand())
           :kind==="wd"?(cand(z=>z.d.e>0&&z.d.e<=2)||cand())
           :cand();
    if(a){draft[i]={id:a.d.id,pin,exp:keepExp};draw();}
    else{note="Kein passender Ersatz frei – erst neu würfeln oder etwas anderes tauschen.";render();}
  };

  /* ---- Umsortieren per Drag & Drop ---- */
  // "Reste vom Vorabend" ergeben nur auf einem Werktags-Mittag ab Dienstag Sinn
  const canPlace=(e,i)=>!e||!e.reste||(defs[i].kind==="lunch"&&defs[i].day>0);
  const swapSlots=(i,j)=>{
    if(i===j)return;
    if(!canPlace(draft[i],j)||!canPlace(draft[j],i)){
      note="„Reste vom Vorabend“ passen nur auf ein Mittagessen ab Dienstag."; render(); return;
    }
    const a=draft[i]; draft[i]=draft[j]; draft[j]=a; draw();
  };
  const swapDays=(g1,g2)=>{
    if(g1===g2)return;
    if(g1.dinner!=null&&g2.dinner!=null){const a=draft[g1.dinner];draft[g1.dinner]=draft[g2.dinner];draft[g2.dinner]=a;}
    // Mittagessen wechseln nur, wenn beide Tage eines haben
    if(g1.lunch!=null&&g2.lunch!=null){
      if(canPlace(draft[g1.lunch],g2.lunch)&&canPlace(draft[g2.lunch],g1.lunch)){
        const b=draft[g1.lunch];draft[g1.lunch]=draft[g2.lunch];draft[g2.lunch]=b;
      }else note="Die Mittagessen blieben stehen: „Reste vom Vorabend“ passen nur ab Dienstag.";
    }
    if(note)render(); else draw();
  };
  // Zieh-Geste ohne Bibliothek: Pointer-Events, damit Maus und Finger gleich laufen.
  // Der Griff hat touch-action:none, sonst scrollt das Ziehen die Seite.
  const drag=(ev,src,sel,ok,drop)=>{
    if(ev.button!==undefined&&ev.button>0)return;
    ev.preventDefault();
    const sx=ev.clientX, sy=ev.clientY;
    let started=false,ghost=null,off=null,cur=null,vy=0,raf=0;
    const clear=()=>{if(cur){cur.classList.remove("dropok","dropno");cur=null;}};
    const begin=e=>{
      const r=src.getBoundingClientRect();
      ghost=src.cloneNode(true);
      ghost.classList.add("dragghost");
      ghost.style.width=r.width+"px"; ghost.style.height=r.height+"px";
      document.body.appendChild(ghost);
      document.body.classList.add("dragging-on");
      src.classList.add("dragsrc");
      off={x:e.clientX-r.left,y:e.clientY-r.top};
      raf=requestAnimationFrame(step);
      started=true;
    };
    const step=()=>{ if(vy)window.scrollBy(0,vy); raf=requestAnimationFrame(step); };
    const move=e=>{
      if(!started){ if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<6)return; begin(e); }
      ghost.style.transform=`translate(${e.clientX-off.x}px,${e.clientY-off.y}px)`;
      const under=document.elementFromPoint(e.clientX,e.clientY);
      const t=under?under.closest(sel):null;
      if(t!==cur){ clear(); if(t&&t!==src){cur=t;cur.classList.add(ok(t)?"dropok":"dropno");} }
      vy=e.clientY<70?-14:e.clientY>window.innerHeight-70?14:0;
    };
    const end=e=>{
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",end);
      window.removeEventListener("pointercancel",end);
      if(!started)return;
      cancelAnimationFrame(raf);
      const t=cur; clear();
      ghost.remove(); document.body.classList.remove("dragging-on"); src.classList.remove("dragsrc");
      if(t&&e.type==="pointerup")drop(t); // drop() prüft selbst und erklärt eine Absage
    };
    window.addEventListener("pointermove",move);
    window.addEventListener("pointerup",end);
    window.addEventListener("pointercancel",end);
  };

  /* ---- Einzelnes Gericht ersetzen: Volltextsuche über die ganze Liste ---- */
  const norm=s=>(s||"").toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss");
  const hay=d=>norm([d.n,(d.t||[]).join(" "),BASE[d.b],d.p,(d.z||[]).join(" "),d.w].join(" "));
  const faces=d=>PEOPLE.map(p=>{
    const r=S.ratings[p.id][d.id];
    const c=r==="gern"?"f-gern":r==="ok"?"f-ok":r==="nie"?"f-nie":"f-neu";
    return `<span class="face ${c}" title="${p.name}: ${r==="gern"?"gern":r==="ok"?"geht so":r==="nie"?"nie":"kennt es nicht"}">${p.name[0]}</span>`;
  }).join("");
  const openPicker=i=>{
    const curIds=planIds().filter(x=>x!=null);
    const base=curIds.length?happyAvg(curIds):0;
    const withDish=id=>{const a=planIds();a[i]=id;const l=a.filter(x=>x!=null);return l.length?happyAvg(l):0;};
    const hNow=happyOf(curIds), lowPct=Math.min(...hNow.map(x=>x.pct));
    const lowP=(hNow.find(x=>x.pct===lowPct)||hNow[0]).p;
    const taken=id=>draft.some((e,j)=>j!==i&&e&&e.id===id);
    const pool=D.filter(d=>!S.paused[d.id]&&!taken(d.id));
    const m=el(`<div class="modal"><div class="sheet"><div class="sheethead"><span>${esc(defs[i].l)} ersetzen</span><button class="x" aria-label="Schließen">✕</button></div><input class="searchbox" type="search" placeholder="Suchen: Name, Zutat, Tag …" autocomplete="off"><p class="hint"></p><p class="hint legend">Kürzel = ${PEOPLE.map(x=>x.name).join(", ")}. Gelb: gern · hell: geht so · grün: kennt es nicht · rot: nie.</p><div class="results"></div></div></div>`);
    const q=m.querySelector(".searchbox"), hint=m.querySelector(".hint"), res=m.querySelector(".results");
    const close=()=>{m.remove();document.removeEventListener("keydown",esckey);};
    const esckey=e=>{if(e.key==="Escape")close();};
    const pick=entry=>{draft[i]=entry;close();draw();};
    const rowFor=d=>{
      const dl=withDish(d.id)-base;
      const a=info[d.id];
      const marks=[];
      if(a&&a.veto.length)marks.push("🌭 Extrawurst für "+a.veto.join(", "));
      if(!inSeason(d))marks.push("außerhalb der Saison");
      if(a&&a.veto.length>3)marks.push("4 Vetos");
      const b=el(`<button class="res"><span class="resn">${esc(d.n)}</span><span class="resf">${faces(d)}</span><span class="resd ${dl>0?"up":dl<0?"down":""}">${dl>0?"+":""}${dl} %</span><span class="resm">${BASE[d.b]} · ${d.e?"Aufwand "+"●".repeat(d.e):"geliefert"}${marks.length?" · "+marks.join(" · "):""}</span></button>`);
      b.onclick=()=>pick({id:d.id,pin:true,man:1});
      return b;
    };
    const extras=()=>{
      const out=[];
      const dl0=(curIds.length?withDish(null):0)-base;
      const badge=`<span class="resd ${dl0>0?"up":dl0<0?"down":""}">${dl0>0?"+":""}${dl0} %</span>`;
      if(canPlace({reste:1},i)){
        const b=el(`<button class="res"><span class="resn">Reste vom Vorabend</span>${badge}<span class="resm">aus dem Kühlschrank · Aufwand 0 · zählt nicht in die Zufriedenheit</span></button>`);
        b.onclick=()=>pick({reste:true,pin:true});
        out.push(b);
      }
      if(draft[i]){
        const b=el(`<button class="res"><span class="resn">Platz leeren</span>${badge}<span class="resm">bleibt frei, bis ihr etwas hinlegt</span></button>`);
        b.onclick=()=>pick(null);
        out.push(b);
      }
      return out;
    };
    const show=()=>{
      res.innerHTML="";
      const t=norm(q.value.trim());
      let list;
      if(t.length<2){
        // Ohne Suchbegriff: was den aktuell schwächsten Wert am meisten hebt
        const val=d=>{const r=S.ratings[lowP.id][d.id];return (r==="gern"?2:r==="ok"?1:r==="nie"?-3:0)*10+(withDish(d.id)-base);};
        list=pool.filter(d=>inSeason(d)&&info[d.id]&&info[d.id].veto.length<=3).sort((a,b)=>val(b)-val(a)).slice(0,12);
        hint.textContent=`Vorschläge, die ${lowP.name} (${lowPct} %) am meisten helfen. Die Prozentzahl ist die Änderung am Familien-Schnitt (${base} %).`;
      }else{
        const words=t.split(/\s+/);
        list=pool.filter(d=>{const h=hay(d);return words.every(w=>h.includes(w));}).slice(0,25);
        hint.textContent=list.length?`Die Prozentzahl ist die Änderung am Familien-Schnitt (${base} %).`:"Nichts gefunden – anderer Begriff? Pausierte Gerichte tauchen hier nicht auf.";
      }
      extras().forEach(x=>res.appendChild(x));
      list.forEach(d=>res.appendChild(rowFor(d)));
    };
    q.oninput=show;
    m.querySelector(".x").onclick=close;
    m.onclick=e=>{if(e.target===m)close();};
    document.addEventListener("keydown",esckey);
    document.body.appendChild(m);
    show();
    setTimeout(()=>{if(!("ontouchstart" in window))q.focus();},30);
  };

  /* ---- Zeichnen ---- */
  const slotCard=(i,lunch)=>{
    const e=draft[i], lab=shortLabel(defs[i].l), cls="slot"+(lunch?" mit":"");
    // Mittagskarten bleiben flach: nur Symbole statt beschrifteter Knöpfe
    const tools=lunch
      ?`<div class="slotrow"><button class="swap" title="Neu würfeln" aria-label="Neu würfeln">↻</button><button class="swap rep" title="Gericht suchen und ersetzen" aria-label="Ersetzen">🔍</button>${e?`<button class="swap pin" title="${e.pin?"Gepinnt – schützt den Platz beim Neu-Würfeln":"Pinnen"}" aria-label="Pinnen">📌</button>`:""}</div>`
      :`<div class="slotrow"><button class="swap">↻ Tauschen</button><button class="swap rep">🔍 Ersetzen</button>${e?`<button class="swap pin">${e.pin?"📌 Gepinnt":"📌 Pinnen"}</button>`:""}</div>`;
    const grip=`<button class="grip" aria-label="Verschieben" title="Ziehen: mit einem anderen Essen tauschen">⠿</button>`;
    let s;
    if(e&&e.reste){
      const pd=prevDinner(i);
      s=el(`<div class="${cls}${e.pin?" pinned":""}" data-i="${i}"><div class="day">${lab}</div><div class="dish">Reste vom Vorabend</div><div class="tag">${pd?"von: "+esc(pd.d.n):"aus dem Kühlschrank"} · Aufwand 0</div>${tools}${grip}</div>`);
    }else if(e&&info[e.id]){
      const a=info[e.id];
      const sug=a.veto.length?extraSuggestion(a.veto,a.d.id):null;
      const exLine=a.veto.length?`<div class="ex">🌭 <b>${a.veto.join(" und ")}</b> ${a.veto.length>1?"bekommen":"bekommt"} stattdessen: ${sug?esc(sug.n):"eigenes Essen wählen"}</div>`:"";
      s=el(`<div class="${cls}${e.exp?" exp":""}${e.pin?" pinned":""}" data-i="${i}"><div class="day">${lab}${e.exp?" · Experiment":""}</div><div class="dish">${esc(a.d.n)}</div><div class="tag">${BASE[a.d.b]} · ${a.d.e?"Aufwand "+"●".repeat(a.d.e):"geliefert"}</div>${exLine}${tools}${grip}</div>`);
    }else{
      s=el(`<div class="${cls}" data-i="${i}"><div class="day">${lab}</div><div class="dish">–</div><div class="tag">kein Gericht frei</div>${tools}${grip}</div>`);
    }
    s.querySelector(".swap").onclick=()=>swap(i);
    s.querySelector(".rep").onclick=()=>openPicker(i);
    const pb=s.querySelector(".pin");
    if(pb)pb.onclick=()=>{draft[i].pin=!draft[i].pin;draw();};
    const ok=t=>{const j=+t.dataset.i;return canPlace(draft[i],j)&&canPlace(draft[j],i);};
    const go=t=>swapSlots(i,+t.dataset.i);
    s.querySelector(".grip").addEventListener("pointerdown",ev=>drag(ev,s,".slot[data-i]",ok,go));
    // Mit der Maus lässt sich die ganze Karte ziehen, auf dem Touchscreen nur der Griff
    s.addEventListener("pointerdown",ev=>{
      if(ev.pointerType!=="mouse"||ev.target.closest("button"))return;
      drag(ev,s,".slot[data-i]",ok,go);
    });
    return s;
  };
  const draw=()=>{
    const ids=planIds().filter(x=>x!=null);
    hbox.innerHTML=""; hbox.appendChild(happyBox(ids));
    box.innerHTML="";
    const groups=groupSlots(defs.map(d=>d.l));
    groups.forEach((g,gi)=>{
      let lunchNode;
      if(g.lunch!=null) lunchNode=slotCard(g.lunch,true);
      else{
        const day=WDAYS.indexOf(g.name);
        lunchNode=el(`<button class="lunchoff">+ Mittagessen</button>`);
        lunchNode.onclick=()=>{S.lunch=S.lunch||{};S.lunch[day]=true;save();draft=null;render();};
      }
      const row=dayRowEl(g.name,lunchNode,g.dinner!=null?slotCard(g.dinner,false):el(`<div></div>`));
      row.dataset.g=gi;
      const head=row.querySelector(".pdname");
      head.appendChild(el(`<button class="grip" aria-label="Tag verschieben" title="Ziehen: den ganzen Tag mit einem anderen tauschen">⠿</button>`));
      const okd=()=>true, god=t=>swapDays(g,groups[+t.dataset.g]);
      head.querySelector(".grip").addEventListener("pointerdown",ev=>drag(ev,row,".pday",okd,god));
      head.addEventListener("pointerdown",ev=>{
        if(ev.pointerType!=="mouse"||ev.target.closest("button"))return;
        drag(ev,row,".pday",okd,god);
      });
      box.appendChild(row);
    });
  };
  v.appendChild(el(`<p class="muted">Ein Vorschlag für die Woche. „↻“ würfelt einen Platz neu, „🔍 Ersetzen“ sucht gezielt ein Gericht, „📌“ schützt den Platz beim Neu-Würfeln. Mit dem Griff ⠿ lässt sich ziehen: Karte auf Karte tauscht zwei Essen (Mittag ↔ Abend oder von Tag zu Tag), Tagesleiste auf Tagesleiste tauscht zwei ganze Tage. Oben steht immer, wie happy jede Person mit dem aktuellen Stand ist.</p>`));
  v.appendChild(foldEl("So baut die App den Plan",false,
    el(`<p class="muted">Mo–Fr abends ein einfaches Essen (Aufwand ≤ 2); über die Mittagessen-Chips gibt es an gewählten Werktagen zusätzlich ein Mittagessen – sehr einfach (Aufwand 1) oder ab und zu „Reste vom Vorabend“. Sa/So jeweils Mittag- und Abendessen; eines davon ist Pizza, Burger oder Grillen, ein Platz gehört einem Experiment aus dem ganzen Entdeckungspool. Das Wochenende wird zuerst befüllt, dort sind die Kandidaten am knappsten. Abwechslungs-Limits (bei 9 Mahlzeiten: höchstens zweimal Nudeln, einmal Spätzle, einmal Teig, eine Süßspeise, eine Suppe) wachsen mit der Zahl der Mahlzeiten mit; Brotzeit zählt nicht gegen das Brot-Limit. Reicht die Spitzengruppe nicht, rückt der Rest der Liste nach – ein Platz bleibt praktisch nie leer. Gerichte der letzten zwei übernommenen Pläne werden gemieden (Brotzeit und Klassiker ausgenommen). Bis zu drei Vetos blockieren nicht: höchstens zwei Gerichte pro Woche mit 🌭 Extrawurst, niemand braucht zweimal pro Woche eine – die App schlägt als Extrawurst ein Gericht vor, das alle Veto-Leute mögen. Ab vier Vetos ist ein Gericht raus. Saison-Gerichte pausieren automatisch im falschen Halbjahr.${outSeason?` Gerade außerhalb der Saison: ${outSeason} Gericht${outSeason===1?"":"e"}.`:""}</p>`),
    el(`<p class="muted">Von Hand gesetzte Gerichte (Ersetzen oder Ziehen) hält die App fest: Sie werden automatisch gepinnt und bleiben auch dann stehen, wenn die Automatik sie selbst nie ziehen würde – etwa außerhalb der Saison oder mit vier Vetos. Die Zufriedenheits-Balken rechnen mit gern = 100 %, geht so = 50 %, unbekannt = 37 %, Veto = 25 % und zeigen zum Vergleich die letzten übernommenen Pläne.</p>`)));
  const bz=el(`<label class="toggle"><input type="checkbox"${S.brotwoche?" checked":""}> <span><b>Brotzeit-Woche:</b> Brot ist da – zweimal Brotzeit, Mo/Di oder Di/Mi</span></label>`);
  bz.querySelector("input").onchange=e=>{S.brotwoche=e.target.checked;save();build(draft.map(x=>x&&x.pin?x:null));draw();};
  v.appendChild(bz);
  // Mittagessen-Tage: Chips Mo-Fr, Auswahl bleibt gespeichert
  const lc=el(`<div class="toggle" style="flex-wrap:wrap"><span><b>Mittagessen:</b></span><span class="daychips"></span><span class="muted" style="font-size:12.5px">sehr einfach oder Reste vom Vorabend</span></div>`);
  const chips=lc.querySelector(".daychips");
  const allOn=()=>WDAYS.every((_,i)=>S.lunch&&S.lunch[i]);
  WDAYS.forEach((d,i)=>{
    const c=el(`<button class="daychip${S.lunch&&S.lunch[i]?" on":""}">${d.slice(0,2)}</button>`);
    c.onclick=()=>{S.lunch=S.lunch||{};S.lunch[i]=!S.lunch[i];save();draft=null;render();};
    chips.appendChild(c);
  });
  const call=el(`<button class="daychip${allOn()?" on":""}">alle</button>`);
  call.onclick=()=>{const on=!allOn();S.lunch={};if(on)WDAYS.forEach((_,i)=>S.lunch[i]=true);save();draft=null;render();};
  chips.appendChild(call);
  v.appendChild(lc);
  const hbox=el(`<div></div>`); v.appendChild(hbox);
  const box=el(`<div class="plan"></div>`); v.appendChild(box); draw();
  v.appendChild(el(`<p class="muted" style="margin-top:16px">„Plan übernehmen“ macht diesen Entwurf zum festen Wochenplan: Er bleibt gespeichert stehen (auch nach Neuladen), und ihr bekommt ihn zum Teilen plus eine fertige Einkaufsliste. Ändern geht danach jederzeit über „✎ Plan bearbeiten“ oder „Neuen Plan machen“.</p>`));
  const r=el(`<div class="row"><button class="btn">✓ Plan übernehmen</button><button class="btn ghost">Neu würfeln (Pins bleiben)</button></div>`);
  r.children[0].onclick=()=>{
    S.plan={slots:defs.map((df,i)=>{
      const e=draft[i];
      if(!e)return {l:df.l};
      if(e.reste)return {l:df.l,reste:1};
      return {l:df.l,id:e.id};
    })};
    // Verlauf: die Wiederholungs-Bremse liest die letzten zwei Pläne,
    // die Zufriedenheits-Anzeige den längeren Rückblick
    S.history=[planIds().filter(x=>x!=null),...(S.history||[])].slice(0,8);
    save();draft=null;
    note="Plan übernommen – hier stehen jetzt Teilen und Einkaufsliste.";
    render();
  };
  r.children[1].onclick=()=>{build(draft.map(x=>x&&x.pin?x:null));draw();};
  v.appendChild(r);

  // Pausierte Gerichte: gerade nicht machbar, fliegen aus dem Plan
  const npaused=Object.keys(S.paused).filter(id=>S.paused[id]&&DALL[id]).length;
  const pbody=[];
  pbody.push(el(`<p class="muted">Für alles, was gerade nicht geht – Raclette ohne Gerät, Grillen ohne Grill. Pausierte Gerichte landen nicht im Wochenplan, Bewertungen bleiben erhalten. Die Liste wandert mit dem Familien-Code auf die anderen Geräte.</p>`));
  const pchips=el(`<div class="veto" style="margin-bottom:12px"></div>`);
  const pids=Object.keys(S.paused).filter(id=>S.paused[id]&&DALL[id]);
  if(!pids.length) pchips.appendChild(el(`<span>Gerade ist nichts pausiert.</span>`));
  pids.forEach(id=>{
    const c=el(`<span>${esc(DALL[id].n)}&nbsp;&nbsp;<b style="cursor:pointer;color:var(--mustard)">✕</b></span>`);
    c.querySelector("b").onclick=()=>{delete S.paused[id];save();render();};
    pchips.appendChild(c);
  });
  pbody.push(pchips);
  const ps=el(`<input class="searchbox" type="search" placeholder="Gericht zum Pausieren suchen …">`);
  pbody.push(ps);
  const pres=el(`<div></div>`); pbody.push(pres);
  v.appendChild(foldEl(`Pausierte Gerichte (${npaused})`,false,...pbody));
  ps.oninput=()=>{
    pres.innerHTML="";
    const t=ps.value.trim().toLowerCase();
    if(t.length<2)return;
    D.filter(d=>d.n.toLowerCase().includes(t)&&!S.paused[d.id]).slice(0,8).forEach(d=>{
      const row=el(`<div class="rev"><span class="nm">${esc(d.n)}</span><button class="btn ghost" style="padding:8px 14px">Pausieren</button></div>`);
      row.querySelector("button").onclick=()=>{S.paused[d.id]=true;save();render();};
      pres.appendChild(row);
    });
  };
}

loadDishes().then(()=>{load();render();}).catch(()=>{
  document.getElementById("view").innerHTML='<div class="empty">Die Gerichteliste (dishes.json) konnte nicht geladen werden. Einmal mit Internetverbindung öffnen, danach geht es auch offline.</div>';
});
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
